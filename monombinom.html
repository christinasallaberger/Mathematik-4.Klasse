<style>
/* =========================================================
   HEFTOPTIK
   ========================================================= */

.notebook-work,
.notebook-summary {
  position: relative;
  background-color: #fffefb;

  background-image:
    linear-gradient(
      to right,
      rgba(95, 151, 192, 0.15) 1px,
      transparent 1px
    ),
    linear-gradient(
      to bottom,
      rgba(95, 151, 192, 0.15) 1px,
      transparent 1px
    );

  background-size: 24px 24px;

  border: 1px solid #d7e0e8;
  border-radius: 8px;

  padding: 28px 24px 28px 65px;

  box-shadow:
    0 5px 20px rgba(37, 54, 78, 0.08),
    4px 4px 0 #ffffff,
    5px 5px 0 #dce4eb;
}

.notebook-work::before,
.notebook-summary::before {
  content: "";
  position: absolute;

  left: 45px;
  top: 0;
  bottom: 0;

  width: 2px;

  background: rgba(205, 89, 101, 0.55);

  pointer-events: none;
}

.notebook-work .step {
  border: none;
  border-radius: 0;
  background: transparent;

  padding: 15px 0 20px;
  margin: 0;

  border-bottom: 1px dashed rgba(80, 118, 148, 0.28);
}

.notebook-work .step h3 {
  font-size: 17px;
  color: #456983;

  margin: 5px 0 10px;
}

.notebook-work .math,
.notebook-summary .math,
.notebook-calculation {
  color: #173f72;

  font-family:
    "Segoe Print",
    "Bradley Hand",
    "Comic Sans MS",
    cursive;

  font-size: 25px;
  line-height: 1.9;
}

.notebook-work .products {
  gap: 12px;
}

.notebook-work .product {
  background: rgba(255, 255, 255, 0.72);
  border: 1px dashed #a9bfce;
  border-radius: 5px;
}

.notebook-work input[type="text"] {
  color: #173f72;

  font-family:
    "Segoe Print",
    "Bradley Hand",
    "Comic Sans MS",
    cursive;

  font-size: 23px;

  background: rgba(255, 255, 255, 0.85);

  border: none;
  border-bottom: 2px solid #547d9c;
  border-radius: 0;

  padding: 7px 8px;
}

.notebook-work .notice {
  background: rgba(255, 248, 220, 0.87);
}

.notebook-work .term {
  background: #fffefb;
}

.notebook-work .term.selected {
  background: #f8df9b;
}

.notebook-work #diagram {
  background: transparent;
}

.notebook-work .feedback {
  background: rgba(255, 255, 255, 0.75);
}

.notebook-heading {
  color: #456983;
  font-size: 16px;

  margin-bottom: 14px;
}

.notebook-example-title {
  color: #173f72;
  font-size: 21px;

  margin-bottom: 8px;
}

.notebook-arrow-scroll {
  overflow-x: auto;
  margin: 8px 0 12px;
}

.notebook-arrow-svg {
  display: block;

  width: 100%;
  min-width: 460px;
  max-width: 760px;

  height: auto;
}

.notebook-calculation-line {
  min-height: 45px;
  padding-left: 8px;
}

.notebook-summary .status {
  font-family: Arial, sans-serif;
  font-size: 14px;
}

.notebook-summary .muted {
  font-family: Arial, sans-serif;
}

.notebook-open-note {
  color: #805b22;
  background: rgba(255, 245, 215, 0.9);

  padding: 12px;
  border-radius: 6px;
}

@media (max-width: 700px) {
  .notebook-work,
  .notebook-summary {
    padding: 22px 14px 22px 38px;
  }

  .notebook-work::before,
  .notebook-summary::before {
    left: 25px;
  }

  .notebook-work .math,
  .notebook-summary .math,
  .notebook-calculation {
    font-size: 21px;
  }
}

@media print {
  .notebook-work,
  .notebook-summary {
    box-shadow: none;
    break-inside: avoid;

    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }

  .notebook-arrow-scroll {
    overflow: visible;
  }

  .notebook-arrow-svg {
    min-width: 0;
    max-width: 100%;
  }
}
</style>

<script>
/* =========================================================
   HEFTANSICHT UND PFEILE IN DER ZUSAMMENFASSUNG
   Diesen Block nach den bisherigen Skripten einfügen.
   ========================================================= */

let notebookDrawingNumber = 0;

/*
  Erzeugt eine eigenständige Zeichnung.
  Die Pfeile entsprechen den gespeicherten Verbindungen.
*/
function notebookArrowDrawing(exerciseIndex, savedArrows) {
  const exercise = EXERCISES[exerciseIndex];
  const expectedProducts = products(exercise);

  const drawingId = "notebookArrow" + (++notebookDrawingNumber);

  const width = 680;
  const height = 205;

  const baseline = 166;
  const arrowEnd = 139;
  const boxTop = 142;
  const boxHeight = 44;
  const boxWidth = 84;

  let leftPositions;
  let rightPositions;
  let multiplicationX;
  let leftBracketX = null;
  let leftClosingX = null;
  let rightBracketX;
  let rightClosingX;

  if (exercise.left.length === 1) {
    leftPositions = [145];
    rightPositions = [365, 525];

    multiplicationX = 252;
    rightBracketX = 300;
    rightClosingX = 590;
  } else {
    leftPositions = [95, 225];
    rightPositions = [435, 565];

    leftBracketX = 32;
    leftClosingX = 288;

    multiplicationX = 330;
    rightBracketX = 370;
    rightClosingX = 630;
  }

  function termText(term) {
    return display(
      term.startsWith("-") ? "(" + term + ")" : term
    );
  }

  function termBox(term, x) {
    return `
      <rect
        x="${x - boxWidth / 2}"
        y="${boxTop}"
        width="${boxWidth}"
        height="${boxHeight}"
        rx="7"
        fill="#fffefb"
        stroke="#8daac1"
        stroke-width="1.5"
      ></rect>

      <text
        x="${x}"
        y="${baseline}"
        text-anchor="middle"
        dominant-baseline="middle"
        fill="#173f72"
        font-size="25"
        font-family="Segoe Print, Comic Sans MS, cursive"
      >
        ${termText(term)}
      </text>
    `;
  }

  const symbols = [];

  if (exercise.left.length > 1) {
    symbols.push(`
      <text x="${leftBracketX}" y="${baseline}"
        text-anchor="middle" dominant-baseline="middle"
        font-size="34" fill="#173f72">(</text>

      <text x="${(leftPositions[0] + leftPositions[1]) / 2}"
        y="${baseline}" text-anchor="middle"
        dominant-baseline="middle"
        font-size="26" fill="#173f72">+</text>

      <text x="${leftClosingX}" y="${baseline}"
        text-anchor="middle" dominant-baseline="middle"
        font-size="34" fill="#173f72">)</text>
    `);
  }

  symbols.push(`
    <text x="${multiplicationX}" y="${baseline}"
      text-anchor="middle" dominant-baseline="middle"
      font-size="30" fill="#173f72">·</text>

    <text x="${rightBracketX}" y="${baseline}"
      text-anchor="middle" dominant-baseline="middle"
      font-size="34" fill="#173f72">(</text>

    <text x="${(rightPositions[0] + rightPositions[1]) / 2}"
      y="${baseline}" text-anchor="middle"
      dominant-baseline="middle"
      font-size="26" fill="#173f72">+</text>

    <text x="${rightClosingX}" y="${baseline}"
      text-anchor="middle" dominant-baseline="middle"
      font-size="34" fill="#173f72">)</text>
  `);

  const uniqueArrows = [
    ...new Set(Array.isArray(savedArrows) ? savedArrows : [])
  ];

  const paths = uniqueArrows.map(pair => {
    const productIndex =
      expectedProducts.findIndex(product => product.key === pair);

    if (productIndex < 0) return "";

    const [leftIndex, rightIndex] = pair.split(",").map(Number);

    const x1 = leftPositions[leftIndex];
    const x2 = rightPositions[rightIndex];

    const controlY = 4 + productIndex * 24;

    const labelX = (x1 + x2) / 2;
    const labelY = arrowEnd / 4 + controlY * 0.75;

    return `
      <path
        d="M ${x1} ${arrowEnd}
           C ${x1} ${controlY},
             ${x2} ${controlY},
             ${x2} ${arrowEnd}"
        fill="none"
        stroke="#147d92"
        stroke-width="2.5"
        marker-end="url(#${drawingId})"
      ></path>

      <rect
        x="${labelX - 11}"
        y="${labelY - 12}"
        width="22"
        height="22"
        rx="8"
        fill="#fffefb"
      ></rect>

      <text
        x="${labelX}"
        y="${labelY + 3}"
        text-anchor="middle"
        font-size="14"
        fill="#173f72"
        font-family="Arial, sans-serif"
      >
        ${productIndex + 1}
      </text>
    `;
  }).join("");

  return `
    <div class="notebook-arrow-scroll">
      <svg
        class="notebook-arrow-svg"
        viewBox="0 0 ${width} ${height}"
        role="img"
        aria-label="${escapeHTML(
          source(exercise) + " mit " +
          uniqueArrows.length + " gespeicherten Verteilungspfeilen"
        )}"
      >
        <defs>
          <marker
            id="${drawingId}"
            markerWidth="8"
            markerHeight="8"
            refX="7"
            refY="4"
            orient="auto"
          >
            <path
              d="M0 0 L0 8 L8 4 Z"
              fill="#147d92"
            ></path>
          </marker>
        </defs>

        ${paths}

        ${exercise.left.map((term, index) =>
          termBox(term, leftPositions[index])
        ).join("")}

        ${exercise.right.map((term, index) =>
          termBox(term, rightPositions[index])
        ).join("")}

        ${symbols.join("")}
      </svg>
    </div>
  `;
}

/*
  Vollständiger Rechenweg mit den gespeicherten Pfeilen.
  Nur bereits richtig gelöste Beispiele erhalten alle Lösungszeilen.
*/
function notebookCompletedCalculation(index) {
  const exercise = EXERCISES[index];
  const task = state.tasks[index];

  const list = products(exercise);

  const multiplicationLine =
    typeof task.multiplicationLine === "string" &&
    task.multiplicationLine.trim()
      ? task.multiplicationLine.replace(/^\s*=\s*/, "")
      : list.map(product =>
          "(" + product.left + ") · (" + product.right + ")"
        ).join(" + ");

  return `
    ${notebookArrowDrawing(index, task.arrows)}

    <div class="notebook-calculation">
      <div class="notebook-calculation-line">
        = ${display(multiplicationLine)}
      </div>

      <div class="notebook-calculation-line">
        = ${display(
          joinTerms(list.map(product => product.result))
        )}
      </div>

      <div class="notebook-calculation-line">
        = ${display(finalResult(exercise))}
      </div>
    </div>
  `;
}

/*
  Die vorhandene Übungsansicht bleibt funktionsfähig.
  Anschließend wird die Heftgestaltung ergänzt.
*/
const renderExerciseBeforeNotebook = renderExercise;

renderExercise = function () {
  renderExerciseBeforeNotebook();

  if (!state || state.overview) return;

  const firstStep = document.querySelector("#app .step");

  if (!firstStep) return;

  const workCard = firstStep.closest(".card");

  if (!workCard) return;

  workCard.classList.add("notebook-work");

  const heading = document.createElement("div");
  heading.className = "notebook-heading";
  heading.textContent =
    "Mathematikheft · " + state.name +
    " · Beispiel " + (state.current + 1);

  workCard.insertBefore(heading, workCard.firstChild);

  const task = state.tasks[state.current];

  /*
    Im Hefteintrag die bisherige Rechnung durch
    Rechnung plus tatsächliche Verteilungspfeile ersetzen.
  */
  if (task.step === 4) {
    const notices = workCard.querySelectorAll(".notice");

    for (const notice of notices) {
      const copyCheckbox =
        notice.querySelector('input[type="checkbox"]');

      if (!copyCheckbox) continue;

      const existingCalculation = notice.querySelector(".math");

      if (existingCalculation) {
        const replacement = document.createElement("div");

        replacement.innerHTML =
          notebookCompletedCalculation(state.current);

        existingCalculation.replaceWith(replacement);
      }
    }
  }
};

/*
  In der Abschlussübersicht bekommt jedes Beispiel
  einen eigenen Heftausschnitt.

  Nicht bearbeitete Beispiele werden deutlich markiert.
  Bei begonnenen Beispielen erscheinen nur die bisher
  gespeicherten Pfeile, keine vorweggenommenen Lösungen.
*/
const renderOverviewBeforeNotebook = renderOverview;

renderOverview = function () {
  renderOverviewBeforeNotebook();

  if (!state || !state.overview) return;

  if ($("notebookOverview")) {
    $("notebookOverview").remove();
  }

  const notebookOverview = document.createElement("section");
  notebookOverview.id = "notebookOverview";

  notebookOverview.innerHTML = `
    <section class="card">
      <h2>Deine Beispiele im Heft</h2>

      <p>
        Hier siehst du die gespeicherten Pfeile.
        Bei richtig gelösten Beispielen wird außerdem
        der vollständige Rechenweg angezeigt.
      </p>
    </section>

    ${EXERCISES.map((exercise, index) => {
      const task = state.tasks[index];
      const currentStatus = status(index);

      let content;

      if (task.step === 4) {
        content = notebookCompletedCalculation(index);
      } else if (currentStatus === "Nicht bearbeitet") {
        content = `
          <div class="math">
            ${display(source(exercise))}
          </div>

          <p class="notebook-open-note">
            Noch nicht bearbeitet:
            Es wurden noch keine Pfeile und kein
            vollständiger Rechenweg gespeichert.
          </p>
        `;
      } else {
        content = `
          ${notebookArrowDrawing(index, task.arrows)}

          <p class="notebook-open-note">
            Noch nicht fertig.
            Angezeigt werden die bisher gespeicherten Pfeile.
            Der vollständige Rechenweg ist noch nicht abgeschlossen.
          </p>
        `;

        if (
          typeof task.multiplicationLine === "string" &&
          task.multiplicationLine.trim()
        ) {
          content += `
            <p class="muted">
              Bisherige Eingabe der Multiplikationszeile
              ${task.step >= 2
                ? "– bereits richtig geprüft:"
                : "– noch nicht richtig bestätigt:"}
            </p>

            <div class="notebook-calculation">
              ${display(task.multiplicationLine)}
            </div>
          `;
        }
      }

      return `
        <section class="card notebook-summary">
          <div class="notebook-heading">
            Mathematikheft · ${escapeHTML(state.name)}
          </div>

          <h3 class="notebook-example-title">
            Beispiel ${index + 1}
          </h3>

          <span
            class="status ${task.copied ? "complete" : ""}"
          >
            ${escapeHTML(currentStatus)}
          </span>

          ${content}

          <p class="muted">
            Hefteintrag:
            ${task.copied
              ? "von dir als übertragen bestätigt"
              : "noch nicht bestätigt"}
          </p>

          <button
            class="secondary noprint"
            onclick="choose(${index})"
          >
            Beispiel ${index + 1} öffnen
          </button>
        </section>
      `;
    }).join("")}
  `;

  /*
    Die Heftausschnitte vor der Lehrkraftübersicht einfügen.
  */
  const cards = Array.from(
    document.querySelectorAll("#app > .card")
  );

  const teacherCard = cards.find(card => {
    const title = card.querySelector("h2");

    return title &&
      title.textContent.trim() === "Lehrkraftübersicht";
  });

  if (teacherCard) {
    teacherCard.before(notebookOverview);
  } else {
    $("app").appendChild(notebookOverview);
  }
};

/* Aktuelle Ansicht mit Heftoptik neu aufbauen. */
render();
</script>
