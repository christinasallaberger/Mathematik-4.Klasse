<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pythagoras in Vierecken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fdfdf9; --grid:#d6e4f2; --ink:#1b2a4a; --pen:#1d4ed8; --muted:#5b6b85;
  --red:#c62828; --red-soft:#fdecea; --green:#2e7d32; --green-soft:#e6f4e7;
  --marker:#ffe36e; --tri:#eaf1fb; --card:#ffffff; --line:#c9d6e6; --btn:#1b2a4a; --btn-ink:#ffffff;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151b26; --grid:#222d3e; --ink:#e6ecf5; --pen:#8fb1ff; --muted:#9aa8bf;
    --red:#ff7a7a; --red-soft:#3a1e22; --green:#6fd17a; --green-soft:#17301c;
    --marker:#7a6516; --tri:#1e2a3e; --card:#1b2231; --line:#33415a; --btn:#e6ecf5; --btn-ink:#151b26;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#151b26; --grid:#222d3e; --ink:#e6ecf5; --pen:#8fb1ff; --muted:#9aa8bf;
  --red:#ff7a7a; --red-soft:#3a1e22; --green:#6fd17a; --green-soft:#17301c;
  --marker:#7a6516; --tri:#1e2a3e; --card:#1b2231; --line:#33415a; --btn:#e6ecf5; --btn-ink:#151b26;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:17px; line-height:1.5;
}
.wrap{max-width:1080px;margin:0 auto;padding:28px 18px 60px}
header h1{font-family:"Patrick Hand","Comic Sans MS",cursive;font-weight:400;font-size:clamp(34px,6vw,52px);line-height:1.05;margin:0 0 6px;color:var(--pen)}
header p{margin:0 0 20px;color:var(--muted);max-width:60ch}
.controls{display:flex;flex-wrap:wrap;gap:14px 22px;margin-bottom:22px}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{font:inherit;font-size:15px;border:0;background:transparent;color:var(--ink);padding:7px 14px;cursor:pointer}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.ctl-label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.namein{font:inherit;font-size:16px;padding:7px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);width:240px;max-width:100%}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.sheet{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px}
.task{font-size:20px;margin:0 0 8px}
.task b{font-family:"Patrick Hand",cursive;font-size:26px;color:var(--pen);font-weight:400}
svg{width:100%;height:auto;display:block}
.side{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.side.hyp{stroke:var(--red);stroke-width:4}
.side.unk{stroke-dasharray:8 6}
.tri{fill:var(--tri)}
.ra{fill:none;stroke:var(--ink);stroke-width:2}
.dot{fill:var(--ink)}
.lbl{font-family:"Patrick Hand",cursive;font-size:21px;fill:var(--ink)}
.lbl.unk{fill:var(--pen)}
.lbl.hypt{fill:var(--red)}
.merke{margin-top:10px;font-size:15px;color:var(--muted)}
.merke span{background:var(--marker);color:var(--ink);padding:1px 6px;border-radius:3px}
.way-title{margin:18px 0 4px;font-size:15px;color:var(--muted)}
.way{font-family:"Patrick Hand",cursive;font-size:25px;line-height:1.55;color:var(--pen);min-height:44px;border-left:3px solid var(--red);padding-left:14px}
.wayinner:empty::before{content:"Hier entsteht dein Rechenweg.";color:var(--muted);font-size:19px}
.wline{animation:write .35s ease-out}
@keyframes write{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.wline.final{display:inline-block;border-bottom:3px double var(--pen);margin-top:2px}
.steps{display:flex;flex-direction:column;gap:12px}
.step{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.step.solved{border-color:var(--green)}
.step-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.num{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:15px}
.step.solved .num{background:var(--green);border-color:var(--green);color:var(--card)}
.step h3{margin:0;font-size:18px}
.step p{margin:0 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;font-family:"Patrick Hand",cursive;font-size:23px;min-width:56px;padding:4px 14px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){background:var(--tri)}
.opt.good{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.opt.wrongb{background:var(--red-soft);border-color:var(--red);color:var(--red);text-decoration:line-through}
.opt:disabled{cursor:default}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:"Patrick Hand",cursive;font-size:25px}
.eq sup{font-size:17px;margin-left:-4px;align-self:flex-start;margin-top:4px}
.n{font:inherit;font-family:"Patrick Hand",cursive;font-size:24px;width:84px;padding:2px 8px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);color:var(--pen);text-align:center}
.n.wide{width:110px}
.n.word{width:150px}
.n.opsel{width:64px;padding:2px 4px}
.opt.word{font-size:22px}
.n:disabled{border-color:var(--green);color:var(--green)}
.check,.next{font:inherit;font-size:16px;font-weight:700;padding:8px 16px;border-radius:10px;border:0;background:var(--btn);color:var(--btn-ink);cursor:pointer;margin-left:6px}
.check:disabled{opacity:.35;cursor:default}
.fb{font-size:15px;margin-top:8px}
.fb:empty{display:none}
.fb.bad{color:var(--red);background:var(--red-soft);padding:8px 10px;border-radius:8px}
.fb.ok{color:var(--green)}
.link{font:inherit;font-size:15px;background:none;border:0;padding:0;color:var(--pen);text-decoration:underline;cursor:pointer;margin-left:6px}
.done{background:var(--green-soft);border:2px solid var(--green);border-radius:14px;padding:16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.done[hidden]{display:none}
.done p{margin:0;font-size:18px}
.lbl .sub{font-size:16px;fill:var(--muted)}
.score{font-size:15px;color:var(--muted);margin:0 0 12px}
.namerow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.namerow .next{margin-left:0}
.namein.locked{border-color:var(--line);background:transparent;font-weight:700;cursor:default}
[hidden]{display:none!important}
.summary{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:20px}
.summary h2{font-family:"Patrick Hand",cursive;font-weight:400;font-size:32px;line-height:1.1;color:var(--pen);margin:0 0 14px}
.sumhead,.sumstats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-bottom:16px}
.sumhead span,.sumstats span{display:block;font-size:13px;color:var(--muted)}
.sumhead b{font-size:18px}
.sumstats{gap:10px}
.sumstats div{border:2px solid var(--line);border-radius:12px;padding:10px 14px;min-width:120px}
.sumstats b{font-size:26px}
.tablewrap{overflow-x:auto;margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:680px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:700}
tr.okrow td:first-child{box-shadow:inset 4px 0 var(--green)}
tr.errrow td:first-child{box-shadow:inset 4px 0 var(--red)}
.sumnote{color:var(--muted);font-size:15px}
.summary .next{margin-left:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.wline{animation:none}}
.rectbg{fill:none}
.side2{stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.idrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.idl{font-family:"Patrick Hand",cursive;font-size:28px;min-width:30px;color:var(--pen)}
.opt.sel{background:var(--tri);border-color:var(--pen);color:var(--pen)}
.check.solo{margin-left:0;margin-top:4px}
.hit{stroke:transparent;stroke-width:30;stroke-linecap:round;cursor:pointer;pointer-events:stroke;-webkit-tap-highlight-color:transparent}
.lbl{pointer-events:none}
.side.legok{stroke:var(--pen);stroke-width:4}
.side.flash,.side2.flash{stroke:var(--red);stroke-width:5;stroke-dasharray:none}
.tapnote{text-align:center;font-weight:700;color:var(--pen);margin:4px 0 0;font-size:16px}
.n.letter{width:64px}
.tag{font-size:14px;color:var(--muted)}
.aux{stroke:var(--ink);stroke-width:1.6}
.hgt{stroke:var(--ink);stroke-width:2;stroke-dasharray:6 5}
.ext{stroke:var(--muted);stroke-width:2;stroke-dasharray:4 5}
.ov{stroke-width:5;stroke-linecap:round;pointer-events:none}
.ov.hyp{stroke:var(--red)}
.ov.leg{stroke:var(--pen)}
.ov.flash{stroke:var(--red);opacity:.75}
.dim{stroke:var(--muted);stroke-width:1.5}
.vtx{font-size:13px;fill:var(--muted);pointer-events:none}
.n.expr{width:150px}
.tasknav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tnav{font:inherit;font-size:15px;font-weight:700;min-width:44px;padding:6px 10px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.tnav.solved{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.tnav.skipped{border-color:var(--ink);background:var(--marker);color:var(--ink)}
.tnav.cur{outline:3px solid var(--pen);outline-offset:1px}
.tnav.sum{font-weight:400}
.tnav:disabled{opacity:.4;cursor:default}
.latetag{font-size:13px;color:var(--muted)}
.sumbtns{display:flex;flex-wrap:wrap;gap:10px}
.next.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.skip{font:inherit;font-size:15px;margin-top:12px;background:none;border:2px dashed var(--line);color:var(--muted);border-radius:10px;padding:8px 14px;cursor:pointer}
.skip:hover{color:var(--ink);border-color:var(--ink)}
tr.skiprow td{color:var(--muted)}
tr.skiprow td:first-child{box-shadow:inset 4px 0 var(--marker)}
.skiptag{background:var(--marker);color:var(--ink);padding:2px 8px;border-radius:4px;font-weight:700}
.eq .lg{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:16px;min-width:118px}
#sumTime h3{margin:1.2rem 0 .3rem;font-size:1.05rem}.tnote{font-size:.95rem;color:var(--muted)}.tnote b{color:var(--bad,var(--red,#c62828))}</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Pythagoras in Vierecken</h1>
    <p>Deltoid, Parallelogramm und Trapez: Finde das rechtwinklige Dreieck, bestimme Hypotenuse und Katheten und berechne die gesuchte Strecke – Schritt für Schritt, wie im Heft.</p>
  </header>
  <div class="controls">
    <div>
      <label class="ctl-label" for="name">Dein Name</label>
      <div class="namerow"><input id="name" class="namein" autocomplete="off" placeholder="Vor- und Nachname"><button class="next" id="nameOk">Los geht's</button></div>
    </div>
  </div>
  <div class="tasknav" id="tasknav"></div>
  <p class="score" id="score">Gelöst: 0 von 6, davon ohne Fehler: 0</p>
  <div class="grid">
    <div class="sheet">
      <p class="task" id="taskText"></p>
      <div id="fig"></div>
      <p class="way-title">Rechenweg</p>
      <div class="way" id="way"></div>
    </div>
    <div>
      <div class="steps" id="steps"></div>
      <button class="skip" id="skipBtn" hidden>⏭ Aufgabe überspringen</button>
      <div class="done" id="done" hidden>
        <p id="doneText"></p>
        <button class="next" id="nextBtn">Nächste Aufgabe</button>
      </div>
    </div>
  </div>
<section class="summary" id="summary" hidden></section>
</div>

<script>
const TRIPLES=[[3,4,5],[6,8,10],[5,12,13],[9,12,15],[8,15,17],[12,16,20],[15,20,25],[10,24,26],[20,21,29],[18,24,30],[16,30,34],[21,28,35],[24,32,40],[12,35,37]];
const ROUND=6;
const PLAN=[['delta','hyp'],['para2','leg'],['trap','hyp'],['delta','leg'],['para1','hyp'],['trap','leg']];
const state={solved:0,perfect:0,skipped:0,log:[],nameLocked:false,idx:0};
let task=null,bag=[],lastT=null;
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function fmt(x){return String(Math.round(x*100)/100).replace('.',',')}
function parseNum(s){s=String(s).trim().replace(',','.');if(s==='')return NaN;return Number(s)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function norm(s){return String(s).toLowerCase().replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/[:÷]/g,'/').replace(/₁/g,'1').replace(/[*·]/g,'').replace(/,/g,'.');}
function nextTriple(){if(!bag.length){bag=shuffle(TRIPLES);if(bag[bag.length-1]===lastT)bag.reverse();}lastT=bag.pop();return lastT;}
const par=e=>/[+\-−\/ ]/.test(e)?`(${e})`:e;

function makeTask(i){
  const [fig,find]=PLAN[i];
  let t0=nextTriple();if(fig==='para1'&&Math.max(t0[0],t0[1])<12){const k=Math.ceil(12/Math.max(t0[0],t0[1]));t0=t0.map(v=>v*k);}
  const lo=Math.min(t0[0],t0[1]),hi=Math.max(t0[0],t0[1]),Hv=t0[2];
  let T;
  if(fig==='delta'){
    const e1=hi,f2=lo,f=2*f2,e2=Math.max(2,Math.round(e1*(0.5+Math.random()*0.3)));
    T={figName:'Deltoid',H:'a',
      legH:{expr:'e₁',acc:['e1'],val:e1},
      legV:{expr:'f/2',acc:['f/2','(f)/2','0.5f','½f','f/2cm'],val:f2,raw:'f',rawVal:f,
        rawMsg:'Nur die Hälfte der Diagonale f gehört zum Dreieck.',calc:`f/2 = ${f} : 2 = ${f2} cm`,wrong:{'f':'Nur die Hälfte der Diagonale f gehört zum Dreieck.'}},
      geo:{e1,e2,f2},given:find==='hyp'?[['e₁',e1],['f',f]]:[['a',Hv],['f',f]],unkLeg:'legH',
      desc:find==='hyp'?'die Seite a':'das Stück e₁ der Diagonale e'};
  }else if(fig==='para2'){
    const x=lo,h=hi,a=x+Math.max(4,Math.round(h*0.8));
    T={figName:'Parallelogramm',H:'b',legH:{expr:'x',acc:['x'],val:x},legV:{expr:'h',acc:['h'],val:h},
      geo:{a,x,h},given:[['a',a],['b',Hv],['x',x]],unkLeg:'legV',desc:'die Höhe h'};
  }else if(fig==='para1'){
    const L=hi,h=lo,x=Math.max(2,Math.round(L*(0.25+Math.random()*0.15))),a=L-x;
    T={figName:'Parallelogramm',H:'e',
      legH:{expr:'a + x',acc:['a+x','x+a'],val:L,raw:'a',rawVal:a,rawMsg:'Die waagrechte Kathete reicht von A bis unter C – sie ist a + x lang.',
        calc:`a + x = ${a} + ${x} = ${L} cm`,wrong:{'a':'Die waagrechte Kathete reicht von A bis unter den Punkt C – also weiter als a.','x':'Die waagrechte Kathete reicht von A bis unter den Punkt C – sie besteht aus a und x.'}},
      legV:{expr:'h',acc:['h'],val:h},geo:{a,x,h},given:[['a',a],['x',x],['h',h]],unkLeg:'legV',desc:'die Diagonale e'};
  }else{
    const s=lo,h=hi,c=3+rnd(8),a=c+2*s;
    T={figName:'gleichschenkliges Trapez',H:'d',
      legH:{expr:'(a − c)/2',acc:['(a-c)/2'],val:s,raw:'a − c',rawVal:a-c,rawMsg:'Nur die Hälfte von a − c gehört zum Dreieck – auf beiden Seiten liegt ein gleich langes Stück.',
        calc:`(a − c)/2 = (${a} − ${c}) : 2 = ${s} cm`,wrong:{'a-c/2':'Setze Klammern: Zuerst a − c, dann durch 2 → (a − c)/2.','a-c':'Nur die Hälfte von a − c gehört zum Dreieck.','a/2':'Ziehe zuerst c von a ab, dann teile durch 2.','a':'Die Kathete ist nur ein kurzes Stück von a.'}},
      legV:{expr:'h',acc:['h'],val:h},geo:{a,c,h},given:find==='hyp'?[['a',a],['c',c],['h',h]]:[['a',a],['c',c],['d',Hv]],unkLeg:'legV',
      desc:find==='hyp'?'den Schenkel d':'die Höhe h'};
  }
  Object.assign(T,{fig,find,hypVal:Hv,errors:0,shown:0,errSteps:new Set(),hypShown:false,legsShown:false});
  T.unknown=find==='hyp'?T.H:T[T.unkLeg].expr;
  T.known=find==='leg'?(T.unkLeg==='legH'?T.legV:T.legH):null;
  T.sq=find==='hyp'?T.legH.val**2+T.legV.val**2:Hv**2-T.known.val**2;
  T.ans=Math.sqrt(T.sq);
  T.no=i+1;T.status='open';T.started=false;T.wasSkipped=false;
  T.stepsEl=document.createElement('div');T.stepsEl.className='steps';T.stepsEl.hidden=true;$('#steps').appendChild(T.stepsEl);
  T.wayEl=document.createElement('div');T.wayEl.className='wayinner';T.wayEl.hidden=true;$('#way').appendChild(T.wayEl);
  return T;
}
function newRound(){
  $('#steps').innerHTML='';$('#way').innerHTML='';
  state.tasks=[];for(let i=0;i<ROUND;i++)state.tasks.push(makeTask(i));
  showTask(0);
}
const figIn=t=>t.figName==='Deltoid'?'Deltoid':t.figName==='Parallelogramm'?'Parallelogramm':'gleichschenkligen Trapez';
function showTask(i){
  state.cur=i;task=state.tasks[i];
  state.tasks.forEach(t=>{t.stepsEl.hidden=t!==task;t.wayEl.hidden=t!==task;});
  $('#taskText').innerHTML=`<span class="tag">Aufgabe ${task.no} von ${ROUND} · ${task.figName}</span>${task.status==='skipped'?' <span class="skiptag">übersprungen</span>':''}<br>Im ${figIn(task)} ist ein rechtwinkliges Dreieck eingefärbt. Berechne ${task.desc}.`;
  draw();
  if(!state.nameLocked){task.waiting=true;task.stepsEl.innerHTML='<div class="step"><p>Gib oben zuerst deinen Namen ein und tippe auf „Los geht\'s“. Der Name kann danach nicht mehr geändert werden.</p></div>';}
  else if(!task.started){task.waiting=false;task.started=true;task.stepsEl.innerHTML='';stepIdentify();}
  $('#skipBtn').hidden=!state.nameLocked||task.status==='solved';
  updateDone();renderNav();updateScore();
}
function nextOpen(){const n=state.tasks.length;for(let k=1;k<=n;k++){const j=(state.cur+k)%n;if(state.tasks[j].status==='open')return j;}return -1;}
const allDone=()=>state.tasks.every(t=>t.status!=='open');
function updateDone(){
  if(task.status!=='solved'){$('#done').hidden=true;return;}
  $('#doneText').innerHTML=task.doneHTML;
  $('#nextBtn').textContent=nextOpen()>=0?'Nächste Aufgabe':'Zur Zusammenfassung';
  $('#done').hidden=false;
}
function renderNav(){
  const nav=$('#tasknav');
  nav.innerHTML=state.tasks.map((t,i)=>`<button class="tnav ${t.status}${i===state.cur?' cur':''}" data-i="${i}" aria-label="Aufgabe ${i+1}${t.status==='solved'?', gelöst':t.status==='skipped'?', übersprungen':''}">${i+1}${t.status==='solved'?' ✓':t.status==='skipped'?' ⏭':''}</button>`).join('')
    +`<button class="tnav sum" id="navSum" ${allDone()?'':'disabled'}>📋 Zusammenfassung</button>`;
  nav.querySelectorAll('.tnav[data-i]').forEach(b=>b.onclick=()=>{if(state.nameLocked)showTask(+b.dataset.i);});
  $('#navSum').onclick=()=>{if(allDone())showSummary();};
}
function updateScore(){
  const T=state.tasks||[],n=(state.lockedName||$('#name').value.trim());
  const solved=T.filter(t=>t.status==='solved').length,perfect=T.filter(t=>t.status==='solved'&&t.errors===0).length,sk=T.filter(t=>t.status==='skipped').length;
  $('#score').textContent=(n?n+': ':'')+`Gelöst: ${solved} von ${ROUND}, davon ohne Fehler: ${perfect}`+(sk?`, übersprungen: ${sk}`:'');
}
function finish(){

function geom(t){
  const g=t.geo,P={},seg=[],labels=[],dims=[];let tri,others;
  const mid=(p,q)=>[(P[p][0]+P[q][0])/2,(P[p][1]+P[q][1])/2];
  if(t.fig==='delta'){
    Object.assign(P,{A:[0,0],M:[g.e1,0],C:[g.e1+g.e2,0],B:[g.e1,g.f2],D:[g.e1,-g.f2]});
    seg.push(['A','B','side'],['B','C','side'],['C','D','side'],['D','A','side'],['A','C','aux'],['B','D','aux']);
    tri={R:'M',HE:'A',VE:'B'};others=[['B','C'],['C','D'],['D','A'],['M','C'],['M','D']];
    labels.push({at:mid('A','B'),dx:-12,dy:-10,anchor:'end',name:'a',val:t.hypVal,role:'hyp'});
    dims.push({p:'A',q:'M',dir:'h',ref:'D',off:28,name:'e₁',val:g.e1},{p:'B',q:'D',dir:'v',ref:'C',off:22,name:'f',val:2*g.f2});
  }else if(t.fig==='para2'){
    Object.assign(P,{A:[0,0],B:[g.a,0],C:[g.a+g.x,g.h],D:[g.x,g.h],F:[g.x,0]});
    seg.push(['A','B','side'],['B','C','side'],['C','D','side'],['D','A','side'],['D','F','hgt']);
    tri={R:'F',HE:'A',VE:'D'};others=[['F','B'],['B','C'],['C','D']];
    labels.push({at:mid('A','D'),dx:-12,dy:0,anchor:'end',name:'b',val:t.hypVal,role:'hyp'},
      {at:mid('A','F'),dx:0,dy:24,anchor:'middle',name:'x',val:g.x,role:'legH'},
      {at:mid('D','F'),dx:8,dy:0,anchor:'start',name:'h',val:g.h,role:'legV'});
    dims.push({p:'A',q:'B',dir:'h',ref:'A',off:52,name:'a',val:g.a});
  }else if(t.fig==='para1'){
    Object.assign(P,{A:[0,0],B:[g.a,0],C:[g.a+g.x,g.h],D:[g.x,g.h],G:[g.a+g.x,0]});
    seg.push(['A','B','side'],['B','C','side'],['C','D','side'],['D','A','side'],['A','C','aux'],['B','G','ext'],['C','G','hgt']);
    tri={R:'G',HE:'A',VE:'C'};others=[['B','C'],['C','D'],['D','A']];
    labels.push({at:mid('A','C'),dx:-6,dy:-14,anchor:'end',name:'e',val:t.hypVal,role:'hyp'},
      {at:mid('A','B'),dx:0,dy:24,anchor:'middle',name:'a',val:g.a,role:'o'},
      {at:mid('B','G'),dx:0,dy:42,anchor:'middle',name:'x',val:g.x,role:'o'},
      {at:mid('C','G'),dx:8,dy:0,anchor:'start',name:'h',val:g.h,role:'legV'});
  }else{
    Object.assign(P,{A:[0,0],B:[g.a,0],C:[(g.a+g.c)/2,g.h],D:[(g.a-g.c)/2,g.h],F:[(g.a-g.c)/2,0]});
    seg.push(['A','B','side'],['B','C','side'],['C','D','side'],['D','A','side'],['D','F','hgt']);
    tri={R:'F',HE:'A',VE:'D'};others=[['F','B'],['B','C'],['C','D']];
    labels.push({at:mid('A','D'),dx:-12,dy:0,anchor:'end',name:'d',val:t.hypVal,role:'hyp'},
      {at:mid('C','D'),dx:0,dy:-24,anchor:'middle',name:'c',val:g.c,role:'o'},
      {at:mid('B','C'),dx:12,dy:0,anchor:'start',name:'b',val:null,role:'o'},
      {at:mid('D','F'),dx:8,dy:0,anchor:'start',name:'h',val:g.h,role:'legV'});
    dims.push({p:'A',q:'B',dir:'h',ref:'A',off:30,name:'a',val:g.a});
  }
  return {P,seg,labels,dims,tri,others};
}

function draw(){
  const t=task,G=geom(t),W=380,H=310,PL=82,PR=t.fig==='delta'?150:112,PY=58;
  const pts=Object.values(G.P),xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys);
  const sc=Math.min((W-PL-PR)/(mxx-mnx||1),(H-2*PY)/(mxy-mny||1));
  const ox=PL+((W-PL-PR)-(mxx-mnx)*sc)/2,oy=(H-(mxy-mny)*sc)/2;
  const tr=([x,y])=>[ox+(x-mnx)*sc,oy+(mxy-y)*sc];
  const S=k=>tr(G.P[k]);
  const id=t.id||{};
  const L=(p,q,c)=>`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" class="${c}"/>`;
  let out=`<polygon class="tri" points="${[G.tri.R,G.tri.HE,G.tri.VE].map(k=>S(k).join(',')).join(' ')}"/>`;
  G.seg.forEach(([p,q,c])=>out+=L(S(p),S(q),c));
  const segOf={hyp:[G.tri.HE,G.tri.VE],legH:[G.tri.R,G.tri.HE],legV:[G.tri.R,G.tri.VE]};
  G.others.forEach((o,i)=>segOf['o'+i]=o);
  if(t.hypShown||id.hyp)out+=L(S(G.tri.HE),S(G.tri.VE),'ov hyp');
  ['legH','legV'].forEach(k=>{if(t.legsShown||(id.legs&&id.legs.has(k)))out+=L(S(segOf[k][0]),S(segOf[k][1]),'ov leg');});
  if(id.flash&&segOf[id.flash])out+=L(S(segOf[id.flash][0]),S(segOf[id.flash][1]),'ov flash');
  const R=S(G.tri.R),u=unit(R,S(G.tri.HE)),v=unit(R,S(G.tri.VE)),m=14;
  out+=`<path class="ra" d="M${R[0]+u[0]*m},${R[1]+u[1]*m} L${R[0]+u[0]*m+v[0]*m},${R[1]+u[1]*m+v[1]*m} L${R[0]+v[0]*m},${R[1]+v[1]*m}"/><circle class="dot" cx="${R[0]+(u[0]+v[0])*m/2}" cy="${R[1]+(u[1]+v[1])*m/2}" r="2"/>`;
  const txt=(name,val,x)=>name===t.unknown?`${name} = ?<tspan class="sub" x="${x}" dy="1.15em">gesucht</tspan>`:(val==null?name:`${name} = ${fmt(val)} cm`);
  const hypOn=t.hypShown||id.hyp;
  G.labels.forEach(l=>{const p=tr(l.at),x=p[0]+l.dx,y=p[1]+l.dy;
    const cls='lbl'+(l.name===t.unknown?' unk':'')+(l.role==='hyp'&&hypOn?' hypt':'');
    out+=`<text x="${x}" y="${y}" text-anchor="${l.anchor}" dominant-baseline="middle" class="${cls}">${txt(l.name,l.val,x)}</text>`;});
  G.dims.forEach(dm=>{const p=S(dm.p),q=S(dm.q),r=S(dm.ref);
    if(dm.dir==='h'){const y=r[1]+dm.off;out+=L([p[0],y],[q[0],y],'dim')+L([p[0],y-6],[p[0],y+6],'dim')+L([q[0],y-6],[q[0],y+6],'dim');
      out+=`<text x="${(p[0]+q[0])/2}" y="${y+16}" text-anchor="middle" dominant-baseline="middle" class="lbl${dm.name===t.unknown?' unk':''}">${txt(dm.name,dm.val,(p[0]+q[0])/2)}</text>`;}
    else{const x=r[0]+dm.off;out+=L([x,p[1]],[x,q[1]],'dim')+L([x-6,p[1]],[x+6,p[1]],'dim')+L([x-6,q[1]],[x+6,q[1]],'dim');
      out+=`<text x="${x+10}" y="${(p[1]+q[1])/2}" text-anchor="start" dominant-baseline="middle" class="lbl${dm.name===t.unknown?' unk':''}">${txt(dm.name,dm.val,x+10)}</text>`;}});
  const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2,C0=tr([cx,cy]);
  Object.keys(G.P).forEach(k=>{const p=S(k);let dx=p[0]-C0[0],dy=p[1]-C0[1];const l=Math.hypot(dx,dy)||1;
    if(['M','F','G'].includes(k)){dx=.6;dy=.9;}else{dx/=l;dy/=l;}
    out+=`<text x="${p[0]+dx*13}" y="${p[1]+dy*13}" text-anchor="middle" dominant-baseline="middle" class="vtx">${k}</text>`;});
  if(t.selecting)Object.entries(segOf).sort((a,b)=>a[0].startsWith('o')?-1:1).forEach(([k,[p,q]])=>out+=`<line x1="${S(p)[0]}" y1="${S(p)[1]}" x2="${S(q)[0]}" y2="${S(q)[1]}" class="hit" data-seg="${k}"/>`);
  const note=t.selecting?`<p class="tapnote">👆 Tippe in der Zeichnung auf ${id.phase==='hyp'?'die Hypotenuse':'die beiden Katheten'}.</p>`:'';
  $('#fig').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t.figName}">${out}</svg>${note}`;
  if(t.selecting)document.querySelectorAll('#fig .hit').forEach(el=>el.onclick=()=>t.onSeg&&t.onSeg(el.dataset.seg));
}
function unit(p,q){const dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy)||1;return[dx/l,dy/l]}

function addStep(num,title,body){
  const d=document.createElement('section');d.className='step';
  d.innerHTML=`<div class="step-head"><span class="num">${num}</span><h3>${title}</h3></div><div class="body">${body}</div><div class="fb" aria-live="polite"></div>`;
  task.stepsEl.appendChild(d);
  const first=d.querySelector('input');if(first&&num>1)first.focus({preventScroll:true});
  if(num>1&&d.scrollIntoView)d.scrollIntoView({behavior:'smooth',block:'nearest'});
  return d;
}
function wrong(d,msg,solve){
  task.errors++;d.tries=(d.tries||0)+1;task.errSteps.add(d.querySelector('h3').textContent);
  const fb=d.querySelector('.fb');fb.className='fb bad';fb.innerHTML=msg;
  if(d.tries>=2){const b=document.createElement('button');b.className='link';b.textContent='Lösung zeigen';b.onclick=()=>{task.shown++;solve();};fb.appendChild(b);}
}
function note(d,msg){const fb=d.querySelector('.fb');fb.className='fb bad';fb.textContent=msg;}
function right(d,msg){d.classList.add('solved');const fb=d.querySelector('.fb');fb.className='fb ok';fb.textContent='✓ '+msg;
  d.querySelectorAll('input,button,select').forEach(e=>e.disabled=true);}
function addWay(html,cls){const el=document.createElement('div');el.className='wline'+(cls?' '+cls:'');el.innerHTML=html;task.wayEl.appendChild(el);}
function bindCheck(d,fn){d.querySelector('.check').onclick=fn;d.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')fn()}));}

// Schritt 1: Antippen
function flash(key){const t=task;t.id.flash=key;draw();setTimeout(()=>{if(t===task&&t.id.flash===key){t.id.flash=null;draw();}},700);}
function stepIdentify(){
  task.id={phase:'hyp',legs:new Set(),flash:null,hyp:false};task.selecting=true;
  const d=addStep(1,'Hypotenuse und Katheten erkennen',`<p class="idq">Tippe in der Zeichnung auf die <b>Hypotenuse</b> des eingefärbten Dreiecks.</p>`);
  const done=()=>{if(!task.selecting)return;task.selecting=false;task.hypShown=true;task.legsShown=true;task.id.phase='done';draw();
    d.querySelector('.idq').textContent='Die Hypotenuse ist rot, die Katheten sind blau markiert.';
    right(d,`Richtig: ${task.H} ist die Hypotenuse – sie liegt gegenüber vom rechten Winkel.`);stepLegs();};
  task.onSeg=key=>{
    const id=task.id;if(!task.selecting)return;
    const out=key.startsWith('o');
    if(id.phase==='hyp'){
      if(key==='hyp'){id.hyp=true;id.phase='legs';d.querySelector('.idq').innerHTML='Richtig! Tippe jetzt auf die beiden <b>Katheten</b>.';const fb=d.querySelector('.fb');fb.className='fb';fb.innerHTML='';draw();}
      else{flash(key);wrong(d,out?'Diese Strecke gehört nicht zum eingefärbten Dreieck.':'Das ist eine Kathete – sie liegt am rechten Winkel. Die Hypotenuse liegt dem rechten Winkel gegenüber.',done);}
    }else if(id.phase==='legs'){
      if(key==='legH'||key==='legV'){id.legs.add(key);draw();if(id.legs.size===2)done();}
      else{flash(key);wrong(d,key==='hyp'?'Das ist die Hypotenuse. Die Katheten bilden den rechten Winkel.':'Diese Strecke gehört nicht zum eingefärbten Dreieck.',done);}
    }
  };
  draw();
}

// Schritt 2: Länge der Katheten
function stepLegs(){
  const inp=n=>`<input class="n expr" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="${n}">`;
  const d=addStep(2,'Wie lang sind die Katheten?',`<p>Gib die Länge der beiden blauen Katheten mit Buchstaben an, z. B. <i>x/2</i> oder <i>a + b</i>.</p>
    <div class="eq"><span class="lg">↔ waagrecht =</span>${inp('waagrechte Kathete')}</div>
    <div class="eq"><span class="lg">↕ senkrecht =</span>${inp('senkrechte Kathete')}<button class="check">Prüfen</button></div>`);
  const [iH,iV]=d.querySelectorAll('input');
  const ok=(leg,v)=>leg.acc.map(norm).includes(norm(v));
  const solve=()=>{iH.value=task.legH.expr;iV.value=task.legV.expr;right(d,`Richtig: Die Katheten sind ${task.legH.expr} und ${task.legV.expr}.`);stepFind();};
  bindCheck(d,()=>{
    if(!iH.value.trim()||!iV.value.trim()){note(d,'Bitte beide Felder ausfüllen.');return;}
    const okH=ok(task.legH,iH.value),okV=ok(task.legV,iV.value);
    if(okH&&okV){solve();return;}
    const msg=(leg,v,label)=>{const w=leg.wrong&&leg.wrong[norm(v)];return `${label}: ${w||'Schau genau in die Zeichnung, welche Strecke das ist.'}`;};
    const parts=[];if(!okH)parts.push(msg(task.legH,iH.value,'Waagrechte Kathete'));if(!okV)parts.push(msg(task.legV,iV.value,'Senkrechte Kathete'));
    wrong(d,parts.join('<br>'),solve);
  });
}

// Schritt 3: Was ist gesucht?
function stepFind(){
  const U=task.unknown;
  const d=addStep(3,'Was ist gesucht?',`<p>Ist die gesuchte Strecke ${U} eine Hypotenuse oder eine Kathete?</p><div class="opts"><button class="opt word" data-v="hyp">Hypotenuse</button><button class="opt word" data-v="leg">Kathete</button></div>`);
  const solve=()=>{d.querySelector(`[data-v="${task.find}"]`).classList.add('good');
    right(d,task.find==='hyp'?`Richtig: ${U} ist die Hypotenuse.`:`Richtig: ${U} ist eine Kathete.`);stepWords();};
  d.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(b.dataset.v===task.find)solve();
    else{b.classList.add('wrongb');b.disabled=true;
      wrong(d,task.find==='hyp'?`${U} liegt gegenüber vom rechten Winkel – also ist ${U} die Hypotenuse.`:`${U} liegt direkt am rechten Winkel – die Hypotenuse ist ${task.H}.`,solve);}
  });
}

// Schritt 4: Formel mit H und K
function stepWords(){
  const inp=n=>`<input class="n letter" maxlength="12" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Feld ${n}">`;
  const d=addStep(4,'Erste Zeile: Formel mit H und K',`<p>Schreibe die Formel mit <b>H</b> für Hypotenuse und <b>K</b> für Kathete – passend dazu, was gesucht ist – und wähle das Rechenzeichen.</p><div class="eq">${inp(1)}<sup>2</sup><span>=</span>${inp(2)}<sup>2</sup><select class="n opsel" aria-label="Rechenzeichen"><option value="">?</option><option value="+">+</option><option value="−">−</option></select>${inp(3)}<sup>2</sup><button class="check">Prüfen</button></div>`);
  const ins=[...d.querySelectorAll('input')];
  const isH=s=>/^(h|hypo?th?enuse)$/i.test(s.trim()),isK=s=>/^(k|kath?ete)$/i.test(s.trim());
  const leg=task.find==='leg',sel=d.querySelector('select');
  const W=leg?['K','H','K']:['H','K','K'],OP=leg?'−':'+';
  const solve=()=>{W.forEach((w,i)=>ins[i].value=w);sel.value=OP;
    right(d,'Richtig – das ist die erste Zeile!');addWay(`${W[0]}² = ${W[1]}² ${OP} ${W[2]}²`);stepVars();};
  bindCheck(d,()=>{
    const v=ins.map(i=>i.value);
    if(v.some(x=>!x.trim())){note(d,'Bitte alle drei Felder ausfüllen.');return;}
    if(!sel.value){note(d,'Wähle noch das Rechenzeichen (+ oder −).');return;}
    const wordsOk=leg?(isK(v[0])&&isH(v[1])&&isK(v[2])):(isH(v[0])&&isK(v[1])&&isK(v[2]));
    if(wordsOk&&sel.value===OP)solve();
    else if(wordsOk)wrong(d,leg?'Überlege noch einmal: Wird für eine Kathete addiert oder subtrahiert?':'Überlege noch einmal: Wird für die Hypotenuse addiert oder subtrahiert?',solve);
    else if(leg&&isH(v[0]))wrong(d,'Gesucht ist eine Kathete – also steht K allein links vom Ist-gleich.',solve);
    else if(!leg&&isK(v[0]))wrong(d,'Gesucht ist die Hypotenuse – also steht H allein links vom Ist-gleich.',solve);
    else wrong(d,'Verwende H für Hypotenuse und K für Kathete. Links vom Ist-gleich steht die gesuchte Strecke.',solve);
  });
}

// Schritt 5: Variablen
function stepVars(){
  const t=task,H=t.H;let correct,opts;
  if(t.find==='hyp'){
    const a=par(t.legH.expr),b=par(t.legV.expr);correct=`${H}² = ${a}² + ${b}²`;
    const comp=t.legH.raw?'legH':t.legV.raw?'legV':null;
    const d1=comp==='legH'?`${H}² = ${par(t.legH.raw)}² + ${b}²`:comp==='legV'?`${H}² = ${a}² + ${par(t.legV.raw)}²`:`${a}² = ${H}² + ${b}²`;
    opts=[correct,d1,`${H}² = ${a}² − ${b}²`];
  }else{
    const U=t.unknown,K=par(t.known.expr);correct=`${U}² = ${H}² − ${K}²`;
    opts=[correct,`${U}² = ${H}² + ${K}²`,t.known.raw?`${U}² = ${H}² − ${par(t.known.raw)}²`:`${U}² = ${K}² − ${H}²`];
  }
  opts=shuffle(opts);
  const d=addStep(5,'Variablen aus der Skizze einsetzen',`<p>Welche Formel passt zur Skizze?</p><div class="opts">${opts.map(o=>`<button class="opt">${o}</button>`).join('')}</div>`);
  const solve=()=>{d.querySelectorAll('.opt').forEach(b=>{if(b.textContent===correct)b.classList.add('good')});
    right(d,'Richtige Formel!');addWay(correct);stepNumbers();};
  d.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(b.textContent===correct)solve();
    else{b.classList.add('wrongb');b.disabled=true;
      wrong(d,'Setze für die Katheten genau die Längen aus Schritt 2 ein. '+(t.find==='hyp'?'Hypotenuse² = Kathete² + Kathete².':'Kathete² = Hypotenuse² − andere Kathete².'),solve);}
  });
}

// Schritt 6: Zahlen einsetzen
function stepNumbers(){
  const t=task,U=t.unknown,op=t.find==='hyp'?'+':'−';
  const used=t.find==='hyp'?[t.legH,t.legV]:[t.known];
  const comps=used.filter(l=>l.calc);
  const d=addStep(6,'Zahlen einsetzen',`<p>Setze die Zahlen ein (ohne cm).${comps.length?' Rechne die Länge der Kathete vorher im Kopf aus.':''}</p><div class="eq"><span>${U}² =</span><input class="n" inputmode="decimal" aria-label="erste Zahl"><sup>2</sup><span>${op}</span><input class="n" inputmode="decimal" aria-label="zweite Zahl"><sup>2</sup><button class="check">Prüfen</button></div>`);
  const [i1,i2]=d.querySelectorAll('input');
  const exp=t.find==='hyp'?[t.legH.val,t.legV.val]:[t.hypVal,t.known.val];
  const ok=()=>{const a=parseNum(i1.value),b=parseNum(i2.value);
    return t.find==='hyp'?((a===exp[0]&&b===exp[1])||(a===exp[1]&&b===exp[0])):(a===exp[0]&&b===exp[1]);};
  const solve=()=>{if(!ok()){i1.value=fmt(exp[0]);i2.value=fmt(exp[1]);}
    right(d,'Richtig eingesetzt!');comps.forEach(l=>addWay(l.calc));
    addWay(`${U}² = ${fmt(parseNum(i1.value))}² ${op} ${fmt(parseNum(i2.value))}²`);stepCalc(parseNum(i1.value),parseNum(i2.value));};
  bindCheck(d,()=>{
    const a=parseNum(i1.value),b=parseNum(i2.value);
    if(isNaN(a)||isNaN(b)){note(d,'Bitte beide Felder ausfüllen.');return;}
    if(ok()){solve();return;}
    const rawHit=comps.find(l=>a===l.rawVal||b===l.rawVal);
    if(rawHit)wrong(d,`${rawHit.rawMsg} Rechne zuerst ${rawHit.expr} aus.`,solve);
    else if(t.find==='leg'&&a===exp[1]&&b===exp[0])wrong(d,'Vorsicht, Reihenfolge! Zuerst die Hypotenuse, dann wird die andere Kathete abgezogen.',solve);
    else wrong(d,t.find==='hyp'?'Setze die Längen der beiden Katheten ein.':`Setze zuerst die Hypotenuse ${t.H}, dann die bekannte Kathete ${t.known.expr} ein.`,solve);
  });
}

// Schritt 7: Berechnen
function stepCalc(x,y){
  const U=task.unknown;
  const d=addStep(7,'Berechnen',`<p>Rechne die Quadrate aus und dann ${task.find==='hyp'?'addiere':'subtrahiere'} sie.</p><div class="eq"><span>${U}² =</span><input class="n wide" inputmode="decimal" aria-label="Ergebnis"><button class="check">Prüfen</button></div>`);
  const [i1]=d.querySelectorAll('input');
  const solve=()=>{i1.value=fmt(task.sq);right(d,'Richtig gerechnet!');addWay(`${U}² = ${fmt(task.sq)}`);stepRoot();};
  bindCheck(d,()=>{
    const a=parseNum(i1.value);if(isNaN(a))return;
    if(Math.abs(a-task.sq)<1e-9)solve();
    else if(Math.abs(a-(task.find==='hyp'?x+y:x-y))<1e-9)wrong(d,`Du hast die Zahlen noch nicht quadriert. Zum Beispiel: ${fmt(x)}² = ${fmt(x)} · ${fmt(x)}.`,solve);
    else if(Math.abs(a-(task.find==='hyp'?x*x-y*y:x*x+y*y))<1e-9)wrong(d,`Achte auf das Rechenzeichen: hier wird ${task.find==='hyp'?'addiert':'subtrahiert'}.`,solve);
    else wrong(d,`Rechne zuerst ${fmt(x)}² = ${fmt(x)} · ${fmt(x)} und ${fmt(y)}² = ${fmt(y)} · ${fmt(y)}.`,solve);
  });
}

// Schritt 8: Wurzel
function stepRoot(){
  const U=task.unknown,exact=Number.isInteger(task.ans);
  const d=addStep(8,'Wurzel ziehen',`<p>Ziehe die Wurzel aus ${U}² = ${fmt(task.sq)}${exact?'':' und runde auf 2 Dezimalstellen'}.</p><div class="eq"><span>${U} =</span><input class="n wide" inputmode="decimal" aria-label="Ergebnis"><span>cm</span><button class="check">Prüfen</button></div>`);
  const [i1]=d.querySelectorAll('input');
  const solve=()=>{i1.value=fmt(task.ans);right(d,'Super, Aufgabe gelöst!');
    addWay(`√${U}² = √${fmt(task.sq)}`);addWay(`${U} ${exact?'=':'≈'} ${fmt(task.ans)} cm`,'final');finish();};
  bindCheck(d,()=>{
    const a=parseNum(i1.value);if(isNaN(a))return;
    if(Math.abs(a-task.ans)<=(exact?1e-9:0.011))solve();
    else if(Math.abs(a-task.sq)<1e-9)wrong(d,`Das ist noch ${U}². Du musst noch die Wurzel ziehen.`,solve);
    else if(Math.abs(a-task.sq/2)<1e-9)wrong(d,'Wurzel ziehen heißt nicht durch 2 teilen! Gesucht ist die Zahl, die mit sich selbst multipliziert das Ergebnis ergibt.',solve);
    else wrong(d,`Welche Zahl ergibt mal sich selbst ${fmt(task.sq)}?`,solve);
  });
}
</script>
<script>

/* ---------- Bearbeitungszeit ---------- */
const fmtT=ms=>{const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const FAST_MS=20000;let tAct=null,tActTask=null;
function tStop(){if(tActTask&&tAct!=null)tActTask.ms=(tActTask.ms||0)+Date.now()-tAct;tAct=null;tActTask=null;}
const _showTaskT=showTask;showTask=function(i){tStop();_showTaskT(i);if(state.nameLocked&&task&&task.status!=='solved'){tAct=Date.now();tActTask=task;}};
const _finishT=finish;finish=function(){tStop();_finishT();};
const _showSumT=showSummary;showSummary=function(){
  tStop();_showSumT();
  const s=$('#summary'),L=state.tasks;
  const hr=s.querySelector('thead tr');if(hr)hr.insertAdjacentHTML('beforeend','<th>Zeit</th>');
  s.querySelectorAll('tbody tr').forEach((tr,i)=>{const t=L[i],ms=t&&t.ms;tr.insertAdjacentHTML('beforeend','<td>'+(ms!=null?fmtT(ms)+(t.status==='solved'&&ms<FAST_MS?' ⚡':''):'–')+'</td>');});
  const solved=L.filter(t=>t.status==='solved'),tot=L.reduce((a,t)=>a+(t.ms||0),0),fast=solved.filter(t=>t.ms!=null&&t.ms<FAST_MS).length;
  const st=s.querySelector('.sumstats');if(st)st.insertAdjacentHTML('beforeend','<div><b>'+fmtT(tot)+'</b><span>Bearbeitungszeit gesamt (Ø '+(L.length?fmtT(tot/L.length):'–')+' pro Aufgabe)</span></div>');
  const n=s.querySelector('.sumnote');if(n)n.insertAdjacentHTML('beforebegin','<p class="tnote">Zeit = Arbeitszeit an der Aufgabe (bei übersprungenen Aufgaben werden alle Besuche zusammengezählt). ⚡ = in unter 20 Sekunden gelöst.'+(solved.length>=3&&fast/solved.length>0.5?' <b>Auffällig: Mehr als die Hälfte der Aufgaben wurde in unter 20 Sekunden gelöst.</b>':'')+'</p>');
};

/* Bildschirm-Tastatur für die Mathe-Übungen
   Einbinden: in der HTML-Datei direkt vor dem schließenden body-Tag die Zeile
   [script src="tastatur.js"][/script] einfügen (mit spitzen statt eckigen Klammern).
   Passt sich automatisch an das Eingabefeld an:
   - Zahlenfelder:            Ziffern, Komma, Löschen, Cursor, nächstes Feld, Prüfen
   - Felder für H / K:        H, K, + und −
   - Felder für Wörter:       Hypotenuse, Kathete, + und −
   - Felder für Ausdrücke:    Buchstaben, + − / ( ) und Ziffern (z. B. f/2 oder (a − c)/2) */
(function(){
  if(document.getElementById('kpad'))return;            /* Übung hat schon eine Tastatur */
  const NAME_IDS=['name','nameIn','pname'];
  const css=`
#kpad{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card,#fff);border-top:3px solid var(--ink,#1b2a4a);padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(0,0,0,.18);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;color:var(--ink,#1b2a4a)}
#kpad[hidden],#kpadToggle[hidden]{display:none!important}
#kpad .kp-inner{max-width:440px;margin:0 auto}
#kpad .kp-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-weight:700;font-size:15px}
#kpad .kp-small{font:inherit;font-size:15px;padding:3px 12px;background:transparent;color:var(--ink,#1b2a4a);border:2px solid var(--ink,#1b2a4a);border-radius:8px;cursor:pointer}
#kpad .kp-grid{display:grid;gap:6px}
#kpad .kp-grid button{font:inherit;font-size:22px;font-weight:700;padding:7px 0;background:var(--paper,#fdfdf9);color:var(--ink,#1b2a4a);border:2px solid var(--line,#c9d6e6);border-radius:10px;cursor:pointer;touch-action:manipulation}
#kpad .kp-grid button.op{border-color:var(--ink,#1b2a4a);font-size:20px}
#kpad .kp-grid button.act{background:var(--btn,var(--ink,#1b2a4a));color:var(--btn-ink,var(--paper,#fff));border-color:var(--btn,var(--ink,#1b2a4a))}
#kpad .kp-grid button.wide{grid-column:span 2;color:var(--pen,var(--ink,#1d4ed8));border-color:var(--pen,var(--ink,#1d4ed8))}
#kpad .kp-grid button:active{transform:translateY(1px)}
#kpadToggle{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:49;font:inherit;font-size:16px;font-weight:700;padding:9px 16px;border-radius:999px;border:0;background:var(--btn,var(--ink,#1b2a4a));color:var(--btn-ink,var(--paper,#fff));cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2)}
body.kpad-on{padding-bottom:310px}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);

  const MODES={
    num:{title:'Zahlen',cols:4,keys:['7','8','9','⌫','4','5','6',',','1','2','3','←','0','→','⇥','↵']},
    hk:{title:'H und K',cols:4,keys:['H*','K*','+','−','⌫','⇥','↵']},
    word:{title:'Wörter',cols:4,keys:['Hypotenuse*','Kathete*','+','−','⌫','⇥','↵']},
    expr:{title:'Buchstaben',cols:6,keys:['a','b','c','d','e','f','h','x','e₁','+','−','/','(',')','1','2','⌫','←','→','⇥','↵']}
  };
  const TITLE={'⌫':'Löschen','←':'Cursor nach links','→':'Cursor nach rechts','⇥':'Nächstes Feld','↵':'Prüfen','+':'plus','−':'minus','/':'geteilt (Bruchstrich)',',':'Komma'};
  const WHOLE={H:1,K:1,Hypotenuse:1,Kathete:1};
  const coarse=window.matchMedia&&matchMedia('(pointer: coarse)').matches;
  let enabled=true,target=null,mode='',override=null;

  const pad=document.createElement('div');pad.id='kpad';pad.hidden=true;pad.setAttribute('role','group');pad.setAttribute('aria-label','Bildschirm-Tastatur');
  pad.innerHTML='<div class="kp-inner"><div class="kp-head"><span id="kpTitle">Tastatur</span><span><button type="button" class="kp-small" id="kpSwitch" hidden></button> <button type="button" class="kp-small" id="kpClose" title="Tastatur ausblenden">✕</button></span></div><div class="kp-grid"></div></div>';
  const tog=document.createElement('button');tog.id='kpadToggle';tog.type='button';tog.textContent='⌨ Tastatur';tog.hidden=true;
  document.body.append(pad,tog);
  const grid=pad.querySelector('.kp-grid'),sw=document.getElementById('kpSwitch');

  const eligible=el=>el&&el.tagName==='INPUT'&&!NAME_IDS.includes(el.id)&&!el.disabled&&!el.readOnly&&(el.type==='text'||el.type===''||!el.type);
  function naturalMode(el){
    if(el.classList.contains('word'))return 'word';
    if(el.classList.contains('letter'))return 'hk';
    if(el.classList.contains('expr'))return 'expr';
    const im=(el.dataset.im!=null?el.dataset.im:el.getAttribute('inputmode'))||'';
    return (im==='decimal'||im==='numeric')?'num':'expr';
  }
  function draw(m){
    mode=m;const M=MODES[m];
    grid.style.gridTemplateColumns='repeat('+M.cols+',1fr)';
    grid.innerHTML=M.keys.map(k=>{const wide=k.endsWith('*'),key=wide?k.slice(0,-1):k;
      const cls=key==='↵'?'act':wide?'wide':/^[0-9,a-zA-Z₁]+$/.test(key)&&key.length<=2?'':'op';
      return '<button type="button" class="'+cls+'" data-key="'+key+'"'+(TITLE[key]?' title="'+TITLE[key]+'" aria-label="'+TITLE[key]+'"':'')+'>'+key+'</button>';}).join('');
    document.getElementById('kpTitle').textContent=M.title;
    const nat=target?naturalMode(target):m;
    sw.hidden=!(nat==='num'||nat==='expr');
    sw.textContent=m==='num'?'abc':'123';
  }
  function applyMode(el){
    if(!('im' in el.dataset))el.dataset.im=el.getAttribute('inputmode')||'';
    if(enabled&&coarse)el.setAttribute('inputmode','none');
    else if(el.dataset.im)el.setAttribute('inputmode',el.dataset.im);else el.removeAttribute('inputmode');
  }
  const applyAll=()=>document.querySelectorAll('input').forEach(i=>{if(eligible(i))applyMode(i);});
  let t0=null;new MutationObserver(()=>{clearTimeout(t0);t0=setTimeout(applyAll,30);}).observe(document.body,{childList:true,subtree:true});
  function showPad(){pad.hidden=false;tog.hidden=true;document.body.classList.add('kpad-on');}
  function hidePad(){pad.hidden=true;tog.hidden=false;document.body.classList.remove('kpad-on');}

  document.addEventListener('focusin',e=>{
    if(!eligible(e.target))return;
    if(target!==e.target)override=null;
    target=e.target;applyMode(target);draw(override||naturalMode(target));
    if(enabled)showPad();else tog.hidden=false;
  });
  ['pointerdown','mousedown'].forEach(ev=>pad.addEventListener(ev,e=>e.preventDefault()));

  const visibleInputs=()=>[...document.querySelectorAll('input')].filter(i=>eligible(i)&&i.offsetParent!==null);
  function press(k){
    if(!target||!document.body.contains(target)||target.disabled){const f=visibleInputs()[0];if(!f)return;f.focus();}
    target.focus({preventScroll:true});
    const v=target.value;let s=target.selectionStart,e=target.selectionEnd;if(s==null){s=e=v.length;}
    const box=target.closest('.step')||target.closest('.task')||target.parentElement;
    if(k==='↵'){target.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));return;}
    if(k==='⇥'){const all=visibleInputs(),i=all.indexOf(target),n=all[i+1]||all[0];if(n)n.focus();return;}
    if((k==='+'||k==='−')&&(mode==='hk'||mode==='word')){
      const sel=box&&box.querySelector('select');
      if(sel&&!sel.disabled){sel.value=k;sel.dispatchEvent(new Event('change',{bubbles:true}));}
      return;}
    if(WHOLE[k]){target.value=k;target.dispatchEvent(new Event('input',{bubbles:true}));
      const all=visibleInputs(),n=all[all.indexOf(target)+1];if(n&&box&&box.contains(n)&&!n.value)n.focus();return;}
    if(k==='←'){const p=Math.max(0,s-1);target.setSelectionRange(p,p);return;}
    if(k==='→'){const p=Math.min(v.length,e+1);target.setSelectionRange(p,p);return;}
    let nv,pos;
    if(k==='⌫'){
      if(mode==='hk'||mode==='word'){nv='';pos=0;}
      else if(s!==e){nv=v.slice(0,s)+v.slice(e);pos=s;}
      else if(s>0){nv=v.slice(0,s-1)+v.slice(s);pos=s-1;}else return;}
    else{const ins=(k==='−'&&mode==='num')?'-':k;
      if(target.maxLength>0&&v.length>=target.maxLength)return;
      nv=v.slice(0,s)+ins+v.slice(e);pos=s+ins.length;}
    target.value=nv;try{target.setSelectionRange(pos,pos);}catch(_){}
    target.dispatchEvent(new Event('input',{bubbles:true}));
  }
  grid.addEventListener('click',e=>{const b=e.target.closest('[data-key]');if(b)press(b.dataset.key);});
  sw.addEventListener('click',()=>{override=mode==='num'?'expr':'num';draw(override);});
  document.getElementById('kpClose').addEventListener('click',()=>{enabled=false;applyAll();hidePad();});
  tog.addEventListener('click',()=>{enabled=true;applyAll();showPad();
    const f=(target&&document.body.contains(target)&&!target.disabled)?target:visibleInputs()[0];if(f)f.focus();});
  draw('num');applyAll();
})();
</script>
