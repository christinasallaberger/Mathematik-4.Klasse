<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pythagoras im Alltag – Textaufgaben</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fdfdf9; --grid:#d6e4f2; --ink:#1b2a4a; --pen:#1d4ed8; --muted:#5b6b85;
  --red:#c62828; --red-soft:#fdecea; --green:#2e7d32; --green-soft:#e6f4e7;
  --marker:#ffe36e; --tri:#eaf1fb; --card:#ffffff; --line:#c9d6e6; --btn:#1b2a4a; --btn-ink:#ffffff;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151b26; --grid:#222d3e; --ink:#e6ecf5; --pen:#8fb1ff; --muted:#9aa8bf;
    --red:#ff7a7a; --red-soft:#3a1e22; --green:#6fd17a; --green-soft:#17301c;
    --marker:#7a6516; --tri:#1e2a3e; --card:#1b2231; --line:#33415a; --btn:#e6ecf5; --btn-ink:#151b26;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#151b26; --grid:#222d3e; --ink:#e6ecf5; --pen:#8fb1ff; --muted:#9aa8bf;
  --red:#ff7a7a; --red-soft:#3a1e22; --green:#6fd17a; --green-soft:#17301c;
  --marker:#7a6516; --tri:#1e2a3e; --card:#1b2231; --line:#33415a; --btn:#e6ecf5; --btn-ink:#151b26;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:17px; line-height:1.5;
}
.wrap{max-width:1080px;margin:0 auto;padding:28px 18px 60px}
header h1{font-family:"Patrick Hand","Comic Sans MS",cursive;font-weight:400;font-size:clamp(34px,6vw,52px);line-height:1.05;margin:0 0 6px;color:var(--pen)}
header p{margin:0 0 20px;color:var(--muted);max-width:60ch}
.controls{display:flex;flex-wrap:wrap;gap:14px 22px;margin-bottom:22px}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{font:inherit;font-size:15px;border:0;background:transparent;color:var(--ink);padding:7px 14px;cursor:pointer}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.ctl-label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.namein{font:inherit;font-size:16px;padding:7px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);width:240px;max-width:100%}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.sheet{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px}
.task{font-size:20px;margin:0 0 8px}
.task b{font-family:"Patrick Hand",cursive;font-size:26px;color:var(--pen);font-weight:400}
svg{width:100%;height:auto;display:block}
.side{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.side.hyp{stroke:var(--red);stroke-width:4}
.side.unk{stroke-dasharray:8 6}
.tri{fill:var(--tri)}
.ra{fill:none;stroke:var(--ink);stroke-width:2}
.dot{fill:var(--ink)}
.lbl{font-family:"Patrick Hand",cursive;font-size:21px;fill:var(--ink)}
.lbl.unk{fill:var(--pen)}
.lbl.hypt{fill:var(--red)}
.merke{margin-top:10px;font-size:15px;color:var(--muted)}
.merke span{background:var(--marker);color:var(--ink);padding:1px 6px;border-radius:3px}
.way-title{margin:18px 0 4px;font-size:15px;color:var(--muted)}
.way{font-family:"Patrick Hand",cursive;font-size:25px;line-height:1.55;color:var(--pen);min-height:44px;border-left:3px solid var(--red);padding-left:14px}
.wayinner:empty::before{content:"Hier entsteht dein Rechenweg.";color:var(--muted);font-size:19px}
.wline{animation:write .35s ease-out}
@keyframes write{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.wline.final{display:inline-block;border-bottom:3px double var(--pen);margin-top:2px}
.steps{display:flex;flex-direction:column;gap:12px}
.step{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.step.solved{border-color:var(--green)}
.step-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.num{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:15px}
.step.solved .num{background:var(--green);border-color:var(--green);color:var(--card)}
.step h3{margin:0;font-size:18px}
.step p{margin:0 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;font-family:"Patrick Hand",cursive;font-size:23px;min-width:56px;padding:4px 14px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){background:var(--tri)}
.opt.good{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.opt.wrongb{background:var(--red-soft);border-color:var(--red);color:var(--red);text-decoration:line-through}
.opt:disabled{cursor:default}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:"Patrick Hand",cursive;font-size:25px}
.eq sup{font-size:17px;margin-left:-4px;align-self:flex-start;margin-top:4px}
.n{font:inherit;font-family:"Patrick Hand",cursive;font-size:24px;width:84px;padding:2px 8px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);color:var(--pen);text-align:center}
.n.wide{width:110px}
.n.word{width:150px}
.n.opsel{width:64px;padding:2px 4px}
.opt.word{font-size:22px}
.n:disabled{border-color:var(--green);color:var(--green)}
.check,.next{font:inherit;font-size:16px;font-weight:700;padding:8px 16px;border-radius:10px;border:0;background:var(--btn);color:var(--btn-ink);cursor:pointer;margin-left:6px}
.check:disabled{opacity:.35;cursor:default}
.fb{font-size:15px;margin-top:8px}
.fb:empty{display:none}
.fb.bad{color:var(--red);background:var(--red-soft);padding:8px 10px;border-radius:8px}
.fb.ok{color:var(--green)}
.link{font:inherit;font-size:15px;background:none;border:0;padding:0;color:var(--pen);text-decoration:underline;cursor:pointer;margin-left:6px}
.done{background:var(--green-soft);border:2px solid var(--green);border-radius:14px;padding:16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.done[hidden]{display:none}
.done p{margin:0;font-size:18px}
.lbl .sub{font-size:16px;fill:var(--muted)}
.score{font-size:15px;color:var(--muted);margin:0 0 12px}
.namerow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.namerow .next{margin-left:0}
.namein.locked{border-color:var(--line);background:transparent;font-weight:700;cursor:default}
[hidden]{display:none!important}
.summary{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:20px}
.summary h2{font-family:"Patrick Hand",cursive;font-weight:400;font-size:32px;line-height:1.1;color:var(--pen);margin:0 0 14px}
.sumhead,.sumstats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-bottom:16px}
.sumhead span,.sumstats span{display:block;font-size:13px;color:var(--muted)}
.sumhead b{font-size:18px}
.sumstats{gap:10px}
.sumstats div{border:2px solid var(--line);border-radius:12px;padding:10px 14px;min-width:120px}
.sumstats b{font-size:26px}
.tablewrap{overflow-x:auto;margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:680px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:700}
tr.okrow td:first-child{box-shadow:inset 4px 0 var(--green)}
tr.errrow td:first-child{box-shadow:inset 4px 0 var(--red)}
.sumnote{color:var(--muted);font-size:15px}
.summary .next{margin-left:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.wline{animation:none}}
.rectbg{fill:none}
.side2{stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.idrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.idl{font-family:"Patrick Hand",cursive;font-size:28px;min-width:30px;color:var(--pen)}
.opt.sel{background:var(--tri);border-color:var(--pen);color:var(--pen)}
.check.solo{margin-left:0;margin-top:4px}
.hit{stroke:transparent;stroke-width:30;stroke-linecap:round;cursor:pointer;pointer-events:stroke;-webkit-tap-highlight-color:transparent}
.lbl{pointer-events:none}
.side.legok{stroke:var(--pen);stroke-width:4}
.side.flash,.side2.flash{stroke:var(--red);stroke-width:5;stroke-dasharray:none}
.tapnote{text-align:center;font-weight:700;color:var(--pen);margin:4px 0 0;font-size:16px}
.n.letter{width:64px}
.tag{font-size:14px;color:var(--muted)}
.aux{stroke:var(--ink);stroke-width:1.6}
.hgt{stroke:var(--ink);stroke-width:2;stroke-dasharray:6 5}
.ext{stroke:var(--muted);stroke-width:2;stroke-dasharray:4 5}
.ov{stroke-width:5;stroke-linecap:round;pointer-events:none}
.ov.hyp{stroke:var(--red)}
.ov.leg{stroke:var(--pen)}
.ov.flash{stroke:var(--red);opacity:.75}
.dim{stroke:var(--muted);stroke-width:1.5}
.vtx{font-size:13px;fill:var(--muted);pointer-events:none}
.n.expr{width:150px}
.tasknav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tnav{font:inherit;font-size:15px;font-weight:700;min-width:44px;padding:6px 10px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.tnav.solved{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.tnav.skipped{border-color:var(--ink);background:var(--marker);color:var(--ink)}
.tnav.cur{outline:3px solid var(--pen);outline-offset:1px}
.tnav.sum{font-weight:400}
.tnav:disabled{opacity:.4;cursor:default}
.latetag{font-size:13px;color:var(--muted)}
.sumbtns{display:flex;flex-wrap:wrap;gap:10px}
.next.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.skip{font:inherit;font-size:15px;margin-top:12px;background:none;border:2px dashed var(--line);color:var(--muted);border-radius:10px;padding:8px 14px;cursor:pointer}
.skip:hover{color:var(--ink);border-color:var(--ink)}
tr.skiprow td{color:var(--muted)}
tr.skiprow td:first-child{box-shadow:inset 4px 0 var(--marker)}
.skiptag{background:var(--marker);color:var(--ink);padding:2px 8px;border-radius:4px;font-weight:700}
.eq .lg{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:16px;min-width:118px}
.ttitle{font-size:20px;margin:2px 0 6px}
.story{margin:0 0 10px;font-size:17px}
.tag{margin:0;font-size:14px;color:var(--muted)}
.dam{max-width:420px;margin:4px 0 6px}
.damf{fill:var(--tri);stroke:var(--ink);stroke-width:2.5}
.dlbl{font-family:"Patrick Hand",cursive;font-size:17px;fill:var(--ink)}
.dlbl.small{font-size:14px;fill:var(--muted)}
.side.legc{stroke:var(--pen);stroke-width:4}
.lbl.ph{fill:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{font:inherit;text-align:left;border:2px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink);padding:6px 12px;cursor:pointer;display:flex;flex-direction:column;line-height:1.25}
.chip b{font-family:"Patrick Hand",cursive;font-weight:400;font-size:21px;color:var(--pen)}
.chip span{font-size:13px;color:var(--muted)}
.chip.sel{background:var(--marker);border-color:var(--ink)}
.chip.used{opacity:.55}
.seg button:disabled{cursor:default;opacity:.5}
.seg button[aria-pressed="true"]:disabled{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Pythagoras im Alltag</h1>
    <p>Textaufgaben zum pythagoräischen Lehrsatz: Lies genau, fertige die Skizze an und berechne Schritt für Schritt – wie im Heft.</p>
  </header>
  <div class="controls">
    <div>
      <span class="ctl-label">Niveau</span>
      <div class="seg" id="level">
        <button data-v="standard" aria-pressed="true">Standard</button>
        <button data-v="ahs" aria-pressed="false">Standard AHS</button>
      </div>
    </div>
    <div>
      <label class="ctl-label" for="name">Dein Name</label>
      <div class="namerow"><input id="name" class="namein" autocomplete="off" placeholder="Vor- und Nachname"><button class="next" id="nameOk">Los geht's</button></div>
    </div>
  </div>
  <div class="tasknav" id="tasknav"></div>
  <p class="score" id="score"></p>
  <div class="grid">
    <div class="sheet">
      <div id="taskText"></div>
      <p class="way-title">Deine Skizze</p>
      <div id="fig"></div>
      <p class="way-title">Rechenweg</p>
      <div class="way" id="way"></div>
    </div>
    <div>
      <div class="steps" id="steps"></div>
      <button class="skip" id="skipBtn" hidden>⏭ Aufgabe überspringen</button>
      <div class="done" id="done" hidden>
        <p id="doneText"></p>
        <button class="next" id="nextBtn">Nächste Aufgabe</button>
      </div>
    </div>
  </div>
<section class="summary" id="summary" hidden></section>
</div>

<script>
const ROUND=6;
const state={level:'standard',nameLocked:false,cur:0,tasks:[]};
let task=null;
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const rr=(a,b,st)=>+(a+rnd(Math.round((b-a)/st)+1)*st).toFixed(2);
const R=(x,d)=>Math.round(x*10**d)/10**d;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function f(x,d=2){return String(R(x,d)).replace('.',',')}
const fs=x=>f(x,4);
function parseNum(s){s=String(s).trim().replace(',','.');if(s==='')return NaN;return Number(s)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function damSVG(g,showH){
  const W=390,H=170,sc=Math.min(250/g.a,110/g.h),x0=(W-g.a*sc)/2,yb=140,yt=yb-g.h*sc;
  const A=[x0,yb],B=[x0+g.a*sc,yb],D=[x0+g.u*sc,yt],C=[x0+(g.u+g.c)*sc,yt],F=[D[0],yb];
  const t=(x,y,s,a='middle')=>`<text x="${x}" y="${y}" text-anchor="${a}" class="dlbl">${s}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="dam" role="img" aria-label="Querschnitt des Damms">
  <polygon points="${[A,B,C,D].map(p=>p.join(',')).join(' ')}" class="damf"/>
  <line x1="${D[0]}" y1="${D[1]}" x2="${F[0]}" y2="${F[1]}" class="hgt"/>
  ${t((D[0]+C[0])/2,yt-8,`c = ${g.c} m`)}${t((A[0]+D[0])/2-8,(yt+yb)/2,`s = ${g.s} m`,'end')}
  ${t((A[0]+F[0])/2,yb+16,`u = ${g.u} m`)}${t((F[0]+B[0])/2,yb+16,`a = ${g.a} m`)}
  ${t(D[0]+6,(yt+yb)/2+5,showH?`h ≈ ${f(g.hr)} m`:'h','start')}${t((C[0]+B[0])/2+10,(yt+yb)/2-6,'l','start')}
  <text x="${B[0]+6}" y="${yb-4}" text-anchor="start" class="dlbl small">Fluss</text></svg>`;
}

function makeSpecs(level){
  if(level==='standard'){
    const S1=()=>{const l=100*(7+rnd(8)),b=100*(3+rnd(4));
      return {title:'Abkürzung durch den Park',icon:'🌳',unit:'m',find:'hyp',
        text:`Jonas kann auf dem Heimweg quer durch einen rechteckigen Park gehen oder außen herum. Der Park ist ${l} m lang und ${b} m breit. Um wie viel Meter ist der Weg außen herum länger?`,
        H:{v:'d',label:'Weg quer durch den Park'},L:[{v:'l',label:'Länge des Parks',val:l},{v:'b',label:'Breite des Parks',val:b}],
        extra:{type:'num',prompt:'Wie viel länger ist der Weg außen herum? Rechne l + b − d.',calc:r=>l+b-r,line:(r,e)=>`l + b − d = ${l} + ${b} − ${f(r,1)} = ${f(e,1)} m`},
        answer:(r,e)=>`Der Weg außen herum ist um ${f(e,1)} m länger.`};};
    const S2=()=>{let s,a;do{s=rr(250,450,10);a=rr(80,200,10);}while(a>=s*0.7);
      return {title:'Quer über den Fluss',icon:'🚣',unit:'m',find:'leg',
        text:`Mia rudert mit ihrem Boot ans andere Ufer. Weil sie abgetrieben wird, kommt sie ${a} m flussabwärts an. Insgesamt hat sie ${s} m zurückgelegt. Wie breit ist der Fluss?`,
        H:{v:'s',label:'zurückgelegte Strecke',val:s},L:[{v:'a',label:'abgetrieben (flussabwärts)',val:a},{v:'b',label:'Breite des Flusses'}],
        answer:r=>`Der Fluss ist etwa ${f(r,1)} m breit.`};};
    const S3=()=>{const l=rr(3,8,0.5),a=rr(0.8,2,0.1);
      return {title:'Die Leiter an der Hauswand',icon:'🪜',unit:'m',find:'leg',
        text:`Eine ${f(l)} m lange Leiter lehnt an einer Hauswand. Ihr Fuß steht ${f(a)} m von der Wand entfernt. In welcher Höhe lehnt die Leiter an der Wand?`,
        H:{v:'l',label:'Länge der Leiter',val:l},L:[{v:'a',label:'Abstand von der Wand',val:a},{v:'h',label:'Höhe an der Wand'}],
        answer:r=>`Die Leiter lehnt in etwa ${f(r,1)} m Höhe an der Wand.`};};
    const S4=()=>{const h=rr(1.95,2.25,0.05),b=rr(0.8,1,0.05),d=Math.hypot(h,b);let p;do{p=R(d+(Math.random()<.5?1:-1)*(0.07+rnd(8)*0.01),2);}while(Math.abs(R(d,1)-p)<0.04);
      const fits=d>=p;
      return {title:'Die Tischplatte und die Tür',icon:'🚪',unit:'m',find:'hyp',
        text:`Herr Berger möchte eine dünne, ${f(p)} m lange Tischplatte durch eine Tür tragen. Die Tür ist ${f(h)} m hoch und ${f(b)} m breit. Passt die Platte, wenn er sie schräg durch die Tür trägt?`,
        H:{v:'d',label:'Diagonale der Tür'},L:[{v:'b',label:'Breite der Tür',val:b},{v:'h',label:'Höhe der Tür',val:h}],
        extra:{type:'choice',prompt:`Vergleiche die Diagonale mit der Länge der Platte (${f(p)} m). Passt die Platte durch die Tür?`,options:['Ja, sie passt','Nein, sie passt nicht'],correct:fits?0:1,
          line:r=>`d ≈ ${f(r,1)} m ${fits?'≥':'<'} ${f(p)} m`},
        answer:()=>fits?'Die Platte passt schräg durch die Tür.':'Die Platte passt nicht durch die Tür.'};};
    const S5=()=>{const a=rr(2,4,0.1),h=rr(1.5,3,0.1),u=rr(0.3,0.6,0.05);
      return {title:'Ein Geländer für die Treppe',icon:'🏗️',unit:'m',find:'hyp',
        text:`Für eine Treppe wird ein Geländer aus einem Metallrohr gebaut. Die Treppe ist waagrecht gemessen ${f(a)} m lang und ${f(h)} m hoch. Oben und unten soll das Geländer zusätzlich je ${f(u)} m gerade weiterlaufen. Wie lang muss das Rohr mindestens sein?`,
        H:{v:'s',label:'schräges Stück des Geländers'},L:[{v:'a',label:'waagrechte Länge der Treppe',val:a},{v:'h',label:'Höhe der Treppe',val:h}],
        extra:{type:'num',prompt:`Rechne noch die beiden geraden Stücke dazu: s + 2 · ${f(u)}`,calc:r=>r+2*u,line:(r,e)=>`Rohr = s + 2 · ${f(u)} = ${f(r,1)} + ${f(2*u)} = ${f(e,1)} m`},
        answer:(r,e)=>`Das Rohr muss mindestens ${f(e,1)} m lang sein.`};};
    const S6=()=>{let s,a;do{s=rr(8,20,0.5);a=rr(2,6,0.5);}while(a>=s*0.6);
      return {title:'Das Seil am Fahnenmast',icon:'🚩',unit:'m',find:'leg',
        text:`Ein Fahnenmast wird mit einem straff gespannten, ${f(s)} m langen Seil gesichert. Das Seil ist ${f(a)} m vom Fuß des Mastes entfernt im Boden verankert. In welcher Höhe ist es am Mast befestigt?`,
        H:{v:'s',label:'Länge des Seils',val:s},L:[{v:'a',label:'Abstand am Boden',val:a},{v:'h',label:'Höhe am Mast'}],

    return [S1(),S2(),S4(),S3(),S5(),S6()];
  }
  const A1=()=>{const r=rr(2.1,2.45,0.05);

  const A3=()=>{let s,a;do{s=rr(10,25,1);a=rr(3,9,0.5);}while(a>=s*0.6);const hand=rr(1.2,1.6,0.1);

  const g={s:rr(12,18,1),u:rr(5,9,1),c:rr(15,25,1),rgt:rr(20,30,1)};g.a=g.c+g.u+g.rgt;g.h=Math.sqrt(g.s*g.s-g.u*g.u);g.hr=R(g.h,2);

  const A5=()=>({title:'Der Damm – Teil 2',icon:'🌊',unit:'m',find:'hyp',figure:damSVG(g,true),

  const A6=()=>{const h=rr(1.9,2.2,0.05),t=rr(0.5,0.7,0.02),d=Math.hypot(h,t);let room;do{room=R(d+(Math.random()<.5?1:-1)*(0.03+rnd(8)*0.01),2);}while(Math.abs(R(d,2)-room)<0.02);
    const ok=d<room;

}

function makeTask(spec,i){
  const t=Object.assign(spec,{no:i+1,status:'open',started:false,wasSkipped:false,errors:0,shown:0,errSteps:new Set(),stepNo:0});
  t.dec=state.level==='standard'?1:2;
  t.H.role='hyp';t.L.forEach(l=>l.role='leg');
  if(t.find==='hyp'){t.H.unknown=true;t.H.val=Math.hypot(t.L[0].val,t.L[1].val);t.U=t.H;}
  else{t.U=t.L.find(l=>l.val==null);t.U.unknown=true;t.K=t.L.find(l=>l!==t.U);t.U.val=Math.sqrt(t.H.val**2-t.K.val**2);}
  t.sq=t.U.val**2;t.ans=t.U.val;t.r=R(t.ans,t.dec);
  t.chips=shuffle([t.H,...t.L]);
  t.stepsEl=document.createElement('div');t.stepsEl.className='steps';t.stepsEl.hidden=true;$('#steps').appendChild(t.stepsEl);
  t.wayEl=document.createElement('div');t.wayEl.className='wayinner';t.wayEl.hidden=true;$('#way').appendChild(t.wayEl);
  return t;
}
function newRound(){
  $('#steps').innerHTML='';$('#way').innerHTML='';
  state.tasks=makeSpecs(state.level).map(makeTask);
  showTask(0);
}
const tol=t=>t.dec===1?0.051:0.0051;
const chipText=(c,t)=>c.unknown?`${c.v} = ?`:`${c.v} = ${c.disp||f(c.val)+' '+t.unit}`;

function draw(){
  const t=task,W=380,H=250,PL=96,PR=112,PY=34;
  const lw=t.L[0].val,lh=t.L[1].val;const ratio=Math.min(1.6,Math.max(0.35,lh/lw));
  const mw=W-PL-PR,mh=H-2*PY;let pw=mw,ph=pw*ratio;if(ph>mh){ph=mh;pw=ph/ratio;}
  const x0=PL+(mw-pw)/2,y0=PY+(mh-ph)/2;
  const BL=[x0,y0+ph],BR=[x0+pw,y0+ph],TR=[x0+pw,y0];
  const sides={b:[BL,BR],r:[BR,TR],hyp:[BL,TR]};
  const sk=t.sk||{},done=t.sketchDone;
  let out=`<polygon class="tri" points="${[BL,BR,TR].map(p=>p.join(',')).join(' ')}"/>`;
  for(const [k,[p,q]] of Object.entries(sides)){
    const c=sk[k]!=null?t.chips[sk[k]]:null;
    let cls='side';if(done)cls+=k==='hyp'?' hyp':' legc';if(c&&c.unknown)cls+=' unk';
    out+=`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" class="${cls}"/>`;
  }
  const m=14;out+=`<path class="ra" d="M${BR[0]-m},${BR[1]} L${BR[0]-m},${BR[1]-m} L${BR[0]},${BR[1]-m}"/><circle class="dot" cx="${BR[0]-m/2}" cy="${BR[1]-m/2}" r="2"/>`;
  const dm=[(BL[0]+TR[0])/2,(BL[1]+TR[1])/2];let nx=-(TR[1]-BL[1]),ny=TR[0]-BL[0];const nl=Math.hypot(nx,ny);nx=-nx/nl;ny=-ny/nl;
  if(nx>0){nx=-nx;ny=-ny;}
  const pos={b:[(BL[0]+BR[0])/2,BL[1]+22,'middle'],r:[BR[0]+12,(BR[1]+TR[1])/2,'start'],hyp:[dm[0]+nx*18,dm[1]+ny*18,'end']};
  for(const k of ['b','r','hyp']){const c=sk[k]!=null?t.chips[sk[k]]:null;const [x,y,a]=pos[k];
    const cls='lbl'+(c&&c.unknown?' unk':'')+(done&&k==='hyp'?' hypt':'')+(c?'':' ph');
    out+=`<text x="${x}" y="${y}" text-anchor="${a}" dominant-baseline="middle" class="${cls}">${c?chipText(c,t):'…'}</text>`;}
  if(t.selecting)for(const [k,[p,q]] of Object.entries(sides))out+=`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" class="hit" data-seg="${k}"/>`;
  let chips='';
  if(t.selecting){
    const used=new Set(Object.values(sk));
    chips=`<p class="tapnote">👆 Tippe zuerst auf eine Größe und dann auf die passende Seite des Dreiecks.</p><div class="chips">${t.chips.map((c,i)=>`<button class="chip${t.selChip===i?' sel':''}${used.has(i)?' used':''}" data-i="${i}"><b>${chipText(c,t)}</b><span>${c.label}</span></button>`).join('')}</div>`;
  }
  $('#fig').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Skizze: rechtwinkliges Dreieck">${out}</svg>${chips}`;
  if(t.selecting){
    document.querySelectorAll('#fig .hit').forEach(el=>el.onclick=()=>t.onSeg(el.dataset.seg));
    document.querySelectorAll('#fig .chip').forEach(el=>el.onclick=()=>t.onChip(+el.dataset.i));
  }
}

function addStep(title,body){
  const t=task,num=++t.stepNo;
  const d=document.createElement('section');d.className='step';
  d.innerHTML=`<div class="step-head"><span class="num">${num}</span><h3>${title}</h3></div><div class="body">${body}</div><div class="fb" aria-live="polite"></div>`;
  t.stepsEl.appendChild(d);
  const first=d.querySelector('input');if(first&&num>1)first.focus({preventScroll:true});
  if(num>1&&d.scrollIntoView)d.scrollIntoView({behavior:'smooth',block:'nearest'});
  return d;
}
function wrong(d,msg,solve){
  task.errors++;d.tries=(d.tries||0)+1;task.errSteps.add(d.querySelector('h3').textContent);
  const fb=d.querySelector('.fb');fb.className='fb bad';fb.innerHTML=msg;
  if(d.tries>=2){const b=document.createElement('button');b.className='link';b.textContent='Lösung zeigen';b.onclick=()=>{task.shown++;solve();};fb.appendChild(b);}
}
function note(d,msg){const fb=d.querySelector('.fb');fb.className='fb bad';fb.textContent=msg;}
function right(d,msg){d.classList.add('solved');const fb=d.querySelector('.fb');fb.className='fb ok';fb.textContent='✓ '+msg;
  d.querySelectorAll('input,button,select').forEach(e=>e.disabled=true);}
function addWay(html,cls){const el=document.createElement('div');el.className='wline'+(cls?' '+cls:'');el.innerHTML=html;task.wayEl.appendChild(el);}
function bindCheck(d,fn){d.querySelector('.check').onclick=fn;d.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')fn()}));}

// 1 Skizze
function stepSketch(){
  const t=task;t.sk={};t.selecting=true;t.selChip=null;
  const d=addStep('Skizze anfertigen',`<p>Übertrage die Größen aus dem Text in die Skizze: Tippe unter der Skizze auf eine Größe und dann auf die Seite des rechtwinkligen Dreiecks, zu der sie gehört.</p><button class="check solo">Skizze prüfen</button>`);
  t.onSeg=k=>{if(!t.selecting)return;
    if(t.selChip!=null){for(const s in t.sk)if(t.sk[s]===t.selChip)delete t.sk[s];t.sk[k]=t.selChip;t.selChip=null;}
    else delete t.sk[k];draw();};
  t.onChip=i=>{t.selChip=t.selChip===i?null:i;draw();};
  const hypIdx=t.chips.indexOf(t.H),legIdx=t.chips.map((c,i)=>c.role==='leg'?i:-1).filter(i=>i>=0);
  const solve=()=>{let b=t.sk.b,r=t.sk.r;if(!(legIdx.includes(b)&&legIdx.includes(r)&&b!==r)){b=t.chips.indexOf(t.L[0]);r=t.chips.indexOf(t.L[1]);}
    t.sk={hyp:hypIdx,b,r};t.selecting=false;t.sketchDone=true;draw();
    right(d,`Richtig: ${t.H.v} (${t.H.label}) ist die Hypotenuse – sie liegt gegenüber vom rechten Winkel. ${t.L[0].v} und ${t.L[1].v} sind die Katheten.`);stepFind();};
  bindCheck(d,()=>{
    if(['b','r','hyp'].some(k=>t.sk[k]==null)){note(d,'Ordne jeder Seite des Dreiecks eine Größe zu.');return;}
    if(t.sk.hyp===hypIdx)solve();
    else wrong(d,'Noch nicht richtig. Die Hypotenuse liegt gegenüber vom rechten Winkel – im Alltag ist das meist die schräge Strecke (z. B. eine Leiter, ein Seil oder eine Diagonale).',solve);
  });
  draw();
}
// 2 gesucht
function stepFind(){
  const t=task,U=t.U.v;
  const d=addStep('Was ist gesucht?',`<p>Gesucht ist ${U} (${t.U.label}). Ist das eine Hypotenuse oder eine Kathete?</p><div class="opts"><button class="opt word" data-v="hyp">Hypotenuse</button><button class="opt word" data-v="leg">Kathete</button></div>`);
  const solve=()=>{d.querySelector(`[data-v="${t.find}"]`).classList.add('good');right(d,t.find==='hyp'?`Richtig: ${U} ist die Hypotenuse.`:`Richtig: ${U} ist eine Kathete.`);stepWords();};
  d.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(b.dataset.v===t.find)solve();
    else{b.classList.add('wrongb');b.disabled=true;wrong(d,t.find==='hyp'?`${U} liegt in deiner Skizze gegenüber vom rechten Winkel.`:`${U} liegt in deiner Skizze direkt am rechten Winkel.`,solve);}
  });
}
// 3 H und K
function stepWords(){
  const t=task;
  const inp=n=>`<input class="n letter" maxlength="12" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Feld ${n}">`;
  const d=addStep('Erste Zeile: Formel mit H und K',`<p>Schreibe die Formel mit <b>H</b> für Hypotenuse und <b>K</b> für Kathete – passend dazu, was gesucht ist – und wähle das Rechenzeichen.</p><div class="eq">${inp(1)}<sup>2</sup><span>=</span>${inp(2)}<sup>2</sup><select class="n opsel" aria-label="Rechenzeichen"><option value="">?</option><option value="+">+</option><option value="−">−</option></select>${inp(3)}<sup>2</sup><button class="check">Prüfen</button></div>`);
  const ins=[...d.querySelectorAll('input')],sel=d.querySelector('select');
  const isH=s=>/^(h|hypo?th?enuse)$/i.test(s.trim()),isK=s=>/^(k|kath?ete)$/i.test(s.trim());
  const leg=t.find==='leg',W=leg?['K','H','K']:['H','K','K'],OP=leg?'−':'+';
  const solve=()=>{W.forEach((w,i)=>ins[i].value=w);sel.value=OP;right(d,'Richtig – das ist die erste Zeile!');addWay(`${W[0]}² = ${W[1]}² ${OP} ${W[2]}²`);stepVars();};
  bindCheck(d,()=>{
    const v=ins.map(i=>i.value);
    if(v.some(x=>!x.trim())){note(d,'Bitte alle drei Felder ausfüllen.');return;}
    if(!sel.value){note(d,'Wähle noch das Rechenzeichen (+ oder −).');return;}
    const ok=leg?(isK(v[0])&&isH(v[1])&&isK(v[2])):(isH(v[0])&&isK(v[1])&&isK(v[2]));
    if(ok&&sel.value===OP)solve();
    else if(ok)wrong(d,`Überlege noch einmal: Wird für ${leg?'eine Kathete':'die Hypotenuse'} addiert oder subtrahiert?`,solve);
    else if(leg&&isH(v[0]))wrong(d,'Gesucht ist eine Kathete – also steht K allein links vom Ist-gleich.',solve);
    else if(!leg&&isK(v[0]))wrong(d,'Gesucht ist die Hypotenuse – also steht H allein links vom Ist-gleich.',solve);
    else wrong(d,'Verwende H für Hypotenuse und K für Kathete. Links vom Ist-gleich steht die gesuchte Strecke.',solve);
  });
}
// 4 Variablen
function stepVars(){
  const t=task,H=t.H.v;let correct,opts;
  if(t.find==='hyp'){const [A,B]=t.L.map(l=>l.v);correct=`${H}² = ${A}² + ${B}²`;opts=[correct,`${A}² = ${H}² + ${B}²`,`${H}² = ${A}² − ${B}²`];}
  else{const U=t.U.v,K=t.K.v;correct=`${U}² = ${H}² − ${K}²`;opts=[correct,`${U}² = ${H}² + ${K}²`,`${U}² = ${K}² − ${H}²`];}
  opts=shuffle(opts);
  const d=addStep('Variablen aus der Skizze einsetzen',`<p>Welche Formel passt zu deiner Skizze?</p><div class="opts">${opts.map(o=>`<button class="opt">${o}</button>`).join('')}</div>`);
  const solve=()=>{d.querySelectorAll('.opt').forEach(b=>{if(b.textContent===correct)b.classList.add('good')});right(d,'Richtige Formel!');addWay(correct);t.pre?stepPre():stepNumbers();};
  d.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(b.textContent===correct)solve();
    else{b.classList.add('wrongb');b.disabled=true;wrong(d,t.find==='hyp'?'Hypotenuse² = Kathete² + Kathete² – schau, welche Buchstaben in deiner Skizze wo stehen.':'Kathete² = Hypotenuse² − andere Kathete² – schau, welche Buchstaben in deiner Skizze wo stehen.',solve);}
  });
}
// optional: Zwischenrechnung
function stepPre(){
  const t=task,p=t.pre;
  const d=addStep('Zwischenrechnung',`<p>${p.prompt}</p><div class="eq"><span>x =</span><input class="n wide" inputmode="decimal" aria-label="Ergebnis"><span>${t.unit}</span><button class="check">Prüfen</button></div>`);
  const [i1]=d.querySelectorAll('input');
  const solve=()=>{i1.value=f(p.ans);right(d,'Richtig!');addWay(p.line);stepNumbers();};
  bindCheck(d,()=>{const a=parseNum(i1.value);if(isNaN(a))return;
    if(Math.abs(a-p.ans)<1e-9)solve();else wrong(d,'Schau in die Zeichnung: Ziehe von der unteren Seite a die obere Seite c und das Stück u ab.',solve);});
}
// 5 Zahlen
function stepNumbers(){
  const t=task,U=t.U.v,op=t.find==='hyp'?'+':'−';
  const d=addStep('Zahlen einsetzen',`<p>Setze die Zahlen ein (ohne Einheit).</p><div class="eq"><span>${U}² =</span><input class="n" inputmode="decimal" aria-label="erste Zahl"><sup>2</sup><span>${op}</span><input class="n" inputmode="decimal" aria-label="zweite Zahl"><sup>2</sup><button class="check">Prüfen</button></div>`);
  const [i1,i2]=d.querySelectorAll('input');
  const exp=t.find==='hyp'?[t.L[0].val,t.L[1].val]:[t.H.val,t.K.val];
  const eq=(a,b)=>Math.abs(a-b)<1e-9;
  const ok=()=>{const a=parseNum(i1.value),b=parseNum(i2.value);return t.find==='hyp'?((eq(a,exp[0])&&eq(b,exp[1]))||(eq(a,exp[1])&&eq(b,exp[0]))):(eq(a,exp[0])&&eq(b,exp[1]));};
  const solve=()=>{if(!ok()){i1.value=f(exp[0]);i2.value=f(exp[1]);}
    right(d,'Richtig eingesetzt!');const x=parseNum(i1.value),y=parseNum(i2.value);addWay(`${U}² = ${f(x)}² ${op} ${f(y)}²`);stepCalc(x,y);};
  bindCheck(d,()=>{const a=parseNum(i1.value),b=parseNum(i2.value);
    if(isNaN(a)||isNaN(b)){note(d,'Bitte beide Felder ausfüllen.');return;}
    if(ok())solve();
    else if(t.find==='leg'&&eq(a,exp[1])&&eq(b,exp[0]))wrong(d,'Vorsicht, Reihenfolge! Zuerst die Hypotenuse, dann wird die andere Kathete abgezogen.',solve);
    else wrong(d,t.find==='hyp'?'Setze die Längen der beiden Katheten aus deiner Skizze ein.':`Setze zuerst die Hypotenuse ${t.H.v}, dann die Kathete ${t.K.v} ein.`,solve);});
}
// 6 Berechnen
function stepCalc(x,y){
  const t=task,U=t.U.v;
  const d=addStep('Berechnen',`<p>Rechne die Quadrate aus und dann ${t.find==='hyp'?'addiere':'subtrahiere'} sie.</p><div class="eq"><span>${U}² =</span><input class="n wide" inputmode="decimal" aria-label="Ergebnis"><button class="check">Prüfen</button></div>`);
  const [i1]=d.querySelectorAll('input');
  const solve=()=>{i1.value=fs(t.sq);right(d,'Richtig gerechnet!');addWay(`${U}² = ${fs(t.sq)}`);stepRoot();};
  bindCheck(d,()=>{const a=parseNum(i1.value);if(isNaN(a))return;
    if(Math.abs(a-t.sq)<=0.01)solve();
    else if(Math.abs(a-(t.find==='hyp'?x+y:x-y))<1e-6)wrong(d,`Du hast die Zahlen noch nicht quadriert. Zum Beispiel: ${f(x)}² = ${f(x)} · ${f(x)}.`,solve);
    else if(Math.abs(a-(t.find==='hyp'?x*x-y*y:x*x+y*y))<0.01)wrong(d,`Achte auf das Rechenzeichen: hier wird ${t.find==='hyp'?'addiert':'subtrahiert'}.`,solve);
    else wrong(d,`Rechne zuerst ${f(x)}² = ${f(x)} · ${f(x)} und ${f(y)}² = ${f(y)} · ${f(y)}.`,solve);});
}
// 7 Wurzel
function stepRoot(){
  const t=task,U=t.U.v,exact=Math.abs(t.ans-Math.round(t.ans*10**t.dec)/10**t.dec)<1e-9;
  const rt=t.dec===1?'Runde, wenn nötig, auf eine Dezimalstelle.':'Runde auf zwei Dezimalstellen.';
  const d=addStep('Wurzel ziehen',`<p>Ziehe die Wurzel aus ${U}² = ${fs(t.sq)}. ${rt}</p><div class="eq"><span>${U} ${exact?'=':'≈'}</span><input class="n wide" inputmode="decimal" aria-label="Ergebnis"><span>${t.unit}</span><button class="check">Prüfen</button></div>`);
  const [i1]=d.querySelectorAll('input');
  const solve=()=>{i1.value=f(t.r,t.dec);right(d,t.extra?'Richtig! Jetzt fehlt nur noch ein Schritt.':'Super, Aufgabe gelöst!');
    addWay(`√${U}² = √${fs(t.sq)}`);addWay(`${U} ${exact?'=':'≈'} ${f(t.r,t.dec)} ${t.unit}`);t.extra?stepExtra():finalAnswer();};
  bindCheck(d,()=>{const a=parseNum(i1.value);if(isNaN(a))return;
    if(Math.abs(a-t.ans)<=tol(t))solve();
    else if(Math.abs(a-t.sq)<0.01)wrong(d,`Das ist noch ${U}². Du musst noch die Wurzel ziehen.`,solve);
    else if(Math.abs(a-t.sq/2)<0.01)wrong(d,'Wurzel ziehen heißt nicht durch 2 teilen! Gesucht ist die Zahl, die mit sich selbst multipliziert das Ergebnis ergibt.',solve);
    else if(Math.abs(a-t.ans)<0.2)wrong(d,`Fast! Achte aufs Runden: ${rt}`,solve);
    else wrong(d,`Tippe √${fs(t.sq)} in den Taschenrechner. ${rt}`,solve);});
}
// 8 Weiterrechnen / Antwort
function stepExtra(){
  const t=task,x=t.extra;
  if(x.type==='choice'){
    const d=addStep('Antwort finden',`<p>${x.prompt}</p><div class="opts">${x.options.map((o,i)=>`<button class="opt word" data-i="${i}">${o}</button>`).join('')}</div>`);
    const solve=()=>{d.querySelector(`[data-i="${x.correct}"]`).classList.add('good');right(d,'Richtig!');addWay(x.line(t.r));finalAnswer();};
    d.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(+b.dataset.i===x.correct)solve();else{b.classList.add('wrongb');b.disabled=true;wrong(d,'Vergleiche noch einmal genau die beiden Längen.',solve);}});
    return;
  }
  const e=R(x.calc(t.r),t.dec),u=x.unitX||t.unit;
  const d=addStep('Weiterrechnen',`<p>${x.prompt} ${t.dec===1?'Runde, wenn nötig, auf eine Dezimalstelle.':'Runde auf zwei Dezimalstellen.'}</p><div class="eq"><input class="n wide" inputmode="decimal" aria-label="Ergebnis"><span>${u}</span><button class="check">Prüfen</button></div>`);
  const [i1]=d.querySelectorAll('input');
  const solve=()=>{i1.value=f(e,t.dec);right(d,'Richtig!');addWay(x.line(t.r,e));t.extraVal=e;finalAnswer(e);};
  bindCheck(d,()=>{const a=parseNum(i1.value);if(isNaN(a))return;
    if(Math.abs(a-x.calc(t.r))<=tol(t)||Math.abs(a-x.calc(t.ans))<=tol(t))solve();
    else wrong(d,`Verwende dein Ergebnis ${t.U.v} ≈ ${f(t.r,t.dec)} ${t.unit} und rechne: ${x.prompt.split(':').pop()}`,solve);});
}
function finalAnswer(e){const t=task;t.answerText=t.answer(t.r,e);addWay('Antwort: '+t.answerText,'final');finish();}

// Steuerung
function showTask(i){
  state.cur=i;task=state.tasks[i];const t=task;
  state.tasks.forEach(x=>{x.stepsEl.hidden=x!==t;x.wayEl.hidden=x!==t;});
  $('#taskText').innerHTML=`<p class="tag">Aufgabe ${t.no} von ${ROUND} · ${state.level==='standard'?'Standard':'Standard AHS'}${t.status==='skipped'?' · <span class="skiptag">übersprungen</span>':''}</p><h2 class="ttitle">${t.icon} ${t.title}</h2><p class="story">${t.text}</p>${t.figure||''}`;
  draw();
  if(!state.nameLocked){t.waiting=true;t.stepsEl.innerHTML='<div class="step"><p>Wähle oben dein Niveau, gib deinen Namen ein und tippe auf „Los geht\'s“. Name und Niveau können danach nicht mehr geändert werden.</p></div>';}
  else if(!t.started){t.waiting=false;t.started=true;t.stepsEl.innerHTML='';stepSketch();}
  $('#skipBtn').hidden=!state.nameLocked||t.status==='solved';
  updateDone();renderNav();updateScore();
}
function nextOpen(){const n=state.tasks.length;for(let k=1;k<=n;k++){const j=(state.cur+k)%n;if(state.tasks[j].status==='open')return j;}return -1;}
const allDone=()=>state.tasks.every(t=>t.status!=='open');
function updateDone(){
  if(task.status!=='solved'){$('#done').hidden=true;return;}
  $('#doneText').innerHTML=task.doneHTML;$('#nextBtn').textContent=nextOpen()>=0?'Nächste Aufgabe':'Zur Zusammenfassung';$('#done').hidden=false;
}
function renderNav(){
  const nav=$('#tasknav');
  nav.innerHTML=state.tasks.map((t,i)=>`<button class="tnav ${t.status}${i===state.cur?' cur':''}" data-i="${i}" aria-label="Aufgabe ${i+1}">${i+1}${t.status==='solved'?' ✓':t.status==='skipped'?' ⏭':''}</button>`).join('')
    +`<button class="tnav sum" id="navSum" ${allDone()?'':'disabled'}>📋 Zusammenfassung</button>`;
  nav.querySelectorAll('.tnav[data-i]').forEach(b=>b.onclick=()=>{if(state.nameLocked)showTask(+b.dataset.i);});
  $('#navSum').onclick=()=>{if(allDone())showSummary();};
}
function updateScore(){
  const T=state.tasks,n=$('#name').value.trim();
  const solved=T.filter(t=>t.status==='solved').length,perfect=T.filter(t=>t.status==='solved'&&t.errors===0).length,sk=T.filter(t=>t.status==='skipped').length;
  $('#score').textContent=(n&&state.nameLocked?n+': ':'')+`Gelöst: ${solved} von ${ROUND}, davon ohne Fehler: ${perfect}`+(sk?`, übersprungen: ${sk}`:'');
}
function finish(){
  const t=task;t.status='solved';$('#skipBtn').hidden=true;
  t.doneHTML=(t.errors===0?'Fehlerfrei gelöst – stark!':`Geschafft! (${t.errors} ${t.errors===1?'Fehlversuch':'Fehlversuche'})`)+'<br><strong>✏️ Übertrage jetzt die Skizze und den ganzen Rechenweg mit Antwortsatz in dein Hausübungsheft.</strong>';
  updateDone();renderNav();updateScore();
  $('#nextBtn').focus({preventScroll:true});if($('#done').scrollIntoView)$('#done').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function setMain(show){document.querySelector('.grid').hidden=!show;document.querySelector('.controls').hidden=!show;$('#score').hidden=!show;$('#tasknav').hidden=!show;$('#summary').hidden=show;}
function showSummary(){
  const L=state.tasks,name=$('#name').value.trim()||'–';
  const skL=L.filter(t=>t.status==='skipped');
  const perfect=L.filter(t=>t.status==='solved'&&t.errors===0).length,errs=L.reduce((s,t)=>s+t.errors,0),shown=L.reduce((s,t)=>s+t.shown,0);
  const now=new Date(),dt=now.toLocaleDateString('de-AT')+', '+now.toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'});
  const rows=L.map((t,i)=>t.status==='skipped'
    ?`<tr class="skiprow"><td>${i+1}</td><td>${t.title}</td><td>${t.U.v} (${t.find==='hyp'?'Hypotenuse':'Kathete'})</td><td>–</td><td colspan="3"><span class="skiptag">⏭ übersprungen</span></td></tr>`
    :`<tr class="${t.errors===0?'okrow':t.shown?'errrow':''}"><td>${i+1}</td><td>${t.title}</td><td>${t.U.v} (${t.find==='hyp'?'Hypotenuse':'Kathete'})</td><td>${esc(t.answerText)}${t.wasSkipped?'<br><span class="latetag">zuerst übersprungen, später gelöst</span>':''}</td><td>${t.errors}</td><td>${t.shown?'ja ('+t.shown+'×)':'nein'}</td><td>${t.errSteps.size?esc([...t.errSteps].join(', ')):'–'}</td></tr>`).join('');
  const s=$('#summary');
  s.innerHTML=`<h2>Zusammenfassung für die Lehrkraft</h2>
    <div class="sumhead"><div><span>Name</span><b>${esc(name)}</b></div><div><span>Datum</span><b>${dt}</b></div><div><span>Niveau</span><b>${state.level==='standard'?'Standard':'Standard AHS'}</b></div><div><span>Übung</span><b>Pythagoras im Alltag</b></div></div>
    <div class="sumstats"><div><b>${perfect} / ${L.length}</b><span>ohne Fehler</span></div><div><b>${errs}</b><span>Fehlversuche gesamt</span></div><div><b>${shown}</b><span>Lösungen angezeigt</span></div><div><b>${skL.length}</b><span>übersprungen</span></div></div>
    <div class="tablewrap"><table><thead><tr><th>Nr.</th><th>Aufgabe</th><th>Gesucht</th><th>Antwort</th><th>Fehlversuche</th><th>Lösung gezeigt</th><th>Fehler bei Schritt</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="sumnote">Zeige diese Seite deiner Lehrkraft. Skizzen und Rechenwege stehen in deinem Hausübungsheft.</p>
    <div class="sumbtns">${skL.length?'<button class="next" id="backSkip">↩ Übersprungene Aufgaben lösen</button>':''}<button class="next ghost" id="newRound">Neue Runde starten</button></div>`;
  setMain(false);window.scrollTo({top:0});
  if(skL.length)$('#backSkip').onclick=()=>{setMain(true);skL.forEach(t=>t.status='open');showTask(state.tasks.indexOf(skL[0]));};
  $('#newRound').onclick=()=>{if(!confirm('Neue Runde starten? Die Zusammenfassung wird dabei gelöscht.'))return;setMain(true);newRound();};
}
document.querySelectorAll('#level button').forEach(b=>b.onclick=()=>{if(state.nameLocked)return;
  document.querySelectorAll('#level button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));state.level=b.dataset.v;newRound();});
function lockName(){const n=$('#name');if(state.nameLocked)return;if(!n.value.trim()){n.focus();return;}
  n.value=n.value.trim();n.readOnly=true;n.classList.add('locked');$('#nameOk').hidden=true;state.nameLocked=true;
  document.querySelectorAll('#level button').forEach(x=>{x.disabled=x.getAttribute('aria-pressed')!=='true';});
  state.tasks.forEach(t=>{if(!t.started)t.stepsEl.innerHTML='';});showTask(state.cur);}
$('#nameOk').onclick=lockName;
$('#name').addEventListener('keydown',e=>{if(e.key==='Enter')lockName();});
$('#nextBtn').onclick=()=>{const j=nextOpen();if(j>=0)showTask(j);else showSummary();};
$('#skipBtn').onclick=()=>{if(!task||task.waiting||task.status==='solved')return;
  if(!confirm('Diese Aufgabe überspringen? Du kannst später über die Aufgabenleiste wieder zurückkommen.'))return;
  task.status='skipped';task.wasSkipped=true;const j=nextOpen();if(j>=0)showTask(j);else showSummary();};
newRound();
</script>
<script>
/* Bildschirm-Tastatur für die Mathe-Übungen
   Einbinden: in der HTML-Datei direkt vor dem schließenden body-Tag die Zeile
   [script src="tastatur.js"][/script] einfügen (mit spitzen statt eckigen Klammern).
   Passt sich automatisch an das Eingabefeld an:
   - Zahlenfelder:            Ziffern, Komma, Löschen, Cursor, nächstes Feld, Prüfen
   - Felder für H / K:        H, K, + und −
   - Felder für Wörter:       Hypotenuse, Kathete, + und −
   - Felder für Ausdrücke:    Buchstaben, + − / ( ) und Ziffern (z. B. f/2 oder (a − c)/2) */
(function(){
  if(document.getElementById('kpad'))return;            /* Übung hat schon eine Tastatur */
  const NAME_IDS=['name','nameIn','pname'];
  const css=`
#kpad{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card,#fff);border-top:3px solid var(--ink,#1b2a4a);padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(0,0,0,.18);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;color:var(--ink,#1b2a4a)}
#kpad[hidden],#kpadToggle[hidden]{display:none!important}
#kpad .kp-inner{max-width:440px;margin:0 auto}
#kpad .kp-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-weight:700;font-size:15px}
#kpad .kp-small{font:inherit;font-size:15px;padding:3px 12px;background:transparent;color:var(--ink,#1b2a4a);border:2px solid var(--ink,#1b2a4a);border-radius:8px;cursor:pointer}
#kpad .kp-grid{display:grid;gap:6px}
#kpad .kp-grid button{font:inherit;font-size:22px;font-weight:700;padding:7px 0;background:var(--paper,#fdfdf9);color:var(--ink,#1b2a4a);border:2px solid var(--line,#c9d6e6);border-radius:10px;cursor:pointer;touch-action:manipulation}
#kpad .kp-grid button.op{border-color:var(--ink,#1b2a4a);font-size:20px}
#kpad .kp-grid button.act{background:var(--btn,var(--ink,#1b2a4a));color:var(--btn-ink,var(--paper,#fff));border-color:var(--btn,var(--ink,#1b2a4a))}
#kpad .kp-grid button.wide{grid-column:span 2;color:var(--pen,var(--ink,#1d4ed8));border-color:var(--pen,var(--ink,#1d4ed8))}
#kpad .kp-grid button:active{transform:translateY(1px)}
#kpadToggle{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:49;font:inherit;font-size:16px;font-weight:700;padding:9px 16px;border-radius:999px;border:0;background:var(--btn,var(--ink,#1b2a4a));color:var(--btn-ink,var(--paper,#fff));cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2)}
body.kpad-on{padding-bottom:310px}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);

  const MODES={
    num:{title:'Zahlen',cols:4,keys:['7','8','9','⌫','4','5','6',',','1','2','3','←','0','→','⇥','↵']},
    hk:{title:'H und K',cols:4,keys:['H*','K*','+','−','⌫','⇥','↵']},
    word:{title:'Wörter',cols:4,keys:['Hypotenuse*','Kathete*','+','−','⌫','⇥','↵']},
    expr:{title:'Buchstaben',cols:6,keys:['a','b','c','d','e','f','h','x','e₁','+','−','/','(',')','1','2','⌫','←','→','⇥','↵']}
  };
  const TITLE={'⌫':'Löschen','←':'Cursor nach links','→':'Cursor nach rechts','⇥':'Nächstes Feld','↵':'Prüfen','+':'plus','−':'minus','/':'geteilt (Bruchstrich)',',':'Komma'};
  const WHOLE={H:1,K:1,Hypotenuse:1,Kathete:1};
  const coarse=window.matchMedia&&matchMedia('(pointer: coarse)').matches;
  let enabled=true,target=null,mode='',override=null;

  const pad=document.createElement('div');pad.id='kpad';pad.hidden=true;pad.setAttribute('role','group');pad.setAttribute('aria-label','Bildschirm-Tastatur');
  pad.innerHTML='<div class="kp-inner"><div class="kp-head"><span id="kpTitle">Tastatur</span><span><button type="button" class="kp-small" id="kpSwitch" hidden></button> <button type="button" class="kp-small" id="kpClose" title="Tastatur ausblenden">✕</button></span></div><div class="kp-grid"></div></div>';
  const tog=document.createElement('button');tog.id='kpadToggle';tog.type='button';tog.textContent='⌨ Tastatur';tog.hidden=true;
  document.body.append(pad,tog);
  const grid=pad.querySelector('.kp-grid'),sw=document.getElementById('kpSwitch');

  const eligible=el=>el&&el.tagName==='INPUT'&&!NAME_IDS.includes(el.id)&&!el.disabled&&!el.readOnly&&(el.type==='text'||el.type===''||!el.type);
  function naturalMode(el){
    if(el.classList.contains('word'))return 'word';
    if(el.classList.contains('letter'))return 'hk';
    if(el.classList.contains('expr'))return 'expr';
    const im=(el.dataset.im!=null?el.dataset.im:el.getAttribute('inputmode'))||'';
    return (im==='decimal'||im==='numeric')?'num':'expr';
  }
  function draw(m){
    mode=m;const M=MODES[m];
    grid.style.gridTemplateColumns='repeat('+M.cols+',1fr)';
    grid.innerHTML=M.keys.map(k=>{const wide=k.endsWith('*'),key=wide?k.slice(0,-1):k;
      const cls=key==='↵'?'act':wide?'wide':/^[0-9,a-zA-Z₁]+$/.test(key)&&key.length<=2?'':'op';
      return '<button type="button" class="'+cls+'" data-key="'+key+'"'+(TITLE[key]?' title="'+TITLE[key]+'" aria-label="'+TITLE[key]+'"':'')+'>'+key+'</button>';}).join('');
    document.getElementById('kpTitle').textContent=M.title;
    const nat=target?naturalMode(target):m;
    sw.hidden=!(nat==='num'||nat==='expr');
    sw.textContent=m==='num'?'abc':'123';
  }
  function applyMode(el){
    if(!('im' in el.dataset))el.dataset.im=el.getAttribute('inputmode')||'';
    if(enabled&&coarse)el.setAttribute('inputmode','none');
    else if(el.dataset.im)el.setAttribute('inputmode',el.dataset.im);else el.removeAttribute('inputmode');
  }
  const applyAll=()=>document.querySelectorAll('input').forEach(i=>{if(eligible(i))applyMode(i);});
  let t0=null;new MutationObserver(()=>{clearTimeout(t0);t0=setTimeout(applyAll,30);}).observe(document.body,{childList:true,subtree:true});
  function showPad(){pad.hidden=false;tog.hidden=true;document.body.classList.add('kpad-on');}
  function hidePad(){pad.hidden=true;tog.hidden=false;document.body.classList.remove('kpad-on');}

  document.addEventListener('focusin',e=>{
    if(!eligible(e.target))return;
    if(target!==e.target)override=null;
    target=e.target;applyMode(target);draw(override||naturalMode(target));
    if(enabled)showPad();else tog.hidden=false;
  });
  ['pointerdown','mousedown'].forEach(ev=>pad.addEventListener(ev,e=>e.preventDefault()));

  const visibleInputs=()=>[...document.querySelectorAll('input')].filter(i=>eligible(i)&&i.offsetParent!==null);
  function press(k){
    if(!target||!document.body.contains(target)||target.disabled){const f=visibleInputs()[0];if(!f)return;f.focus();}
    target.focus({preventScroll:true});
    const v=target.value;let s=target.selectionStart,e=target.selectionEnd;if(s==null){s=e=v.length;}
    const box=target.closest('.step')||target.closest('.task')||target.parentElement;
    if(k==='↵'){target.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));return;}
    if(k==='⇥'){const all=visibleInputs(),i=all.indexOf(target),n=all[i+1]||all[0];if(n)n.focus();return;}
    if((k==='+'||k==='−')&&(mode==='hk'||mode==='word')){
      const sel=box&&box.querySelector('select');
      if(sel&&!sel.disabled){sel.value=k;sel.dispatchEvent(new Event('change',{bubbles:true}));}
      return;}
    if(WHOLE[k]){target.value=k;target.dispatchEvent(new Event('input',{bubbles:true}));
      const all=visibleInputs(),n=all[all.indexOf(target)+1];if(n&&box&&box.contains(n)&&!n.value)n.focus();return;}
    if(k==='←'){const p=Math.max(0,s-1);target.setSelectionRange(p,p);return;}
    if(k==='→'){const p=Math.min(v.length,e+1);target.setSelectionRange(p,p);return;}
    let nv,pos;
    if(k==='⌫'){
      if(mode==='hk'||mode==='word'){nv='';pos=0;}
      else if(s!==e){nv=v.slice(0,s)+v.slice(e);pos=s;}
      else if(s>0){nv=v.slice(0,s-1)+v.slice(s);pos=s-1;}else return;}
    else{const ins=(k==='−'&&mode==='num')?'-':k;
      if(target.maxLength>0&&v.length>=target.maxLength)return;
      nv=v.slice(0,s)+ins+v.slice(e);pos=s+ins.length;}
    target.value=nv;try{target.setSelectionRange(pos,pos);}catch(_){}
    target.dispatchEvent(new Event('input',{bubbles:true}));
  }
  grid.addEventListener('click',e=>{const b=e.target.closest('[data-key]');if(b)press(b.dataset.key);});
  sw.addEventListener('click',()=>{override=mode==='num'?'expr':'num';draw(override);});
  document.getElementById('kpClose').addEventListener('click',()=>{enabled=false;applyAll();hidePad();});
  tog.addEventListener('click',()=>{enabled=true;applyAll();showPad();
    const f=(target&&document.body.contains(target)&&!target.disabled)?target:visibleInputs()[0];if(f)f.focus();});
  draw('num');applyAll();
})();
</script>
</body>
