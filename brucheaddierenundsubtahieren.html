<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bruchrechnen – vollständige Übung</title><style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#eef2f8;color:#203047;font-family:Arial,sans-serif}main{max-width:900px;margin:auto;padding:24px;background:white;border-radius:18px;box-shadow:0 6px 24px #0002}h1{color:#7b3f83}h2{color:#254f8e}.name{padding:12px;background:#f4f6fb;border-radius:10px}.name input{width:280px;max-width:100%;text-align:left}.bar{height:12px;background:#dbe3f0;border-radius:8px;overflow:hidden}.bar div{height:100%;background:#7b3f83}.task{margin:22px 0;padding:24px;border:2px solid #e3d4e6;border-radius:14px;background:#fbf4fb;font-size:28px;text-align:center}.f{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.2}.top{padding:3px 7px;border-bottom:2px solid}.bottom{padding:3px 7px}.sg{display:inline-flex;align-items:center;gap:5px}.step{margin-top:18px;padding:18px;border:1px solid #cad5e5;border-radius:12px}.tip{padding:12px;background:#f8f1f9;border-left:5px solid #7b3f83;line-height:1.5}.entry{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px;margin:22px 0;font-size:24px}input,select{width:70px;padding:8px;border:2px solid #9baec7;border-radius:7px;font-size:18px;text-align:center}button{padding:11px 16px;border:none;border-radius:8px;color:white;background:#254f8e;font-size:16px;cursor:pointer;margin:4px}.skip{background:#bd751d}.solution{padding:15px;background:#f2f6fb;border-radius:10px;line-height:2.5}.ok{color:#198754}.bad{color:#c2363d}table{width:100%;border-collapse:collapse}td,th{padding:8px;border:1px solid #cad5e5;text-align:left}details{margin:10px 0}[hidden]{display:none!important}@media(max-width:650px){body{padding:0}main{padding:16px;border-radius:0}.task{font-size:23px}.summary{overflow:auto}}
</style></head><body><main><h1>Brüche multiplizieren und dividieren</h1><p>Gemischte Zahlen zuerst umwandeln und anschließend noch einmal anschreiben.</p><div class="name"><label>Name: <input id="name" placeholder="Vor- und Nachname"></label></div><p id="counter">Aufgabe 1 von 15</p><div class="bar"><div id="bar"></div></div><div id="work"><div class="task" id="task">(+1/3) · (+4/6)</div><section class="step"><h2 id="title">Langer Bruchstrich</h2><div id="info"></div><div class="entry" id="entry"></div><button id="check">Überprüfen</button><button class="skip" id="skip">Ganze Aufgabe überspringen</button><p id="msg" aria-live="polite"></p></section></div><p id="error" class="bad" hidden></p><noscript>JavaScript ist deaktiviert. Bitte diese Datei herunterladen und im Browser öffnen.</noscript><section id="done" hidden><h2>Geschafft!</h2><div class="solution" id="solution"></div><button id="next">Nächste Aufgabe</button></section><section id="end" hidden><h2>Lehrerübersicht</h2><div class="summary" id="summary"></div><button onclick="location.reload()">Noch einmal üben</button><button onclick="window.print()">Übersicht drucken</button></section></main><script>
(function(){'use strict';
var tasks=[["mul", 1, 3, 4, 6, "+", "+", null, null], ["div", 4, 7, 2, 9, "-", "+", null, null], ["mul", 2, 3, 3, 7, "-", "+", null, null], ["div", 5, 8, 15, 16, "+", "-", null, null], ["mul", 6, 9, 3, 8, "-", "+", null, null], ["div", 7, 12, 14, 15, "+", "+", null, null], ["mul", 3, 2, 7, 3, "+", "+", [1, 1, 2], [2, 1, 3]], ["div", 9, 4, 3, 5, "-", "+", [2, 1, 4], null], ["mul", 3, 4, 5, 3, "+", "-", null, [1, 2, 3]], ["div", 8, 5, 8, 3, "-", "-", [1, 3, 5], [2, 2, 3]], ["mul", 14, 3, 5, 14, "+", "-", [4, 2, 3], null], ["div", 5, 6, 5, 4, "-", "+", null, [1, 1, 4]], ["mul", 12, 5, 3, 2, "-", "-", [2, 2, 5], [1, 1, 2]], ["div", 15, 4, 7, 8, "+", "-", [3, 3, 4], null], ["mul", 7, 9, 15, 7, "-", "+", null, [2, 1, 7]]];
var index=0,queue=[],pos=0,C,rec,reports=[],locked=false;
function el(id){return document.getElementById(id)}
function esc(x){return String(x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function gcd(a,b){while(b){var r=a%b;a=b;b=r}return a}
function f(a,b){return '<span class="f"><span class="top">'+a+'</span><span class="bottom">'+b+'</span></span>'}
function sg(s){return s==='-'?'−':'+'}
function sf(s,a,b){return '<span class="sg">'+sg(s)+f(a,b)+'</span>'}
function inp(id){return '<input id="'+id+'" type="number" min="0" step="1" aria-label="'+id+'">'}
function sign(){return '<select id="s" aria-label="Vorzeichen"><option value="">?</option><option value="+">+</option><option value="-">−</option></select>'}
function num(s,a,b,m){return m?'<span class="sg">'+sg(s)+' '+m[0]+' '+f(m[1],m[2])+'</span>':sf(s,a,b)}
function taskHTML(t){return '('+num(t[5],t[1],t[2],t[7])+') '+(t[0]==='mul'?'·':':')+' ('+num(t[6],t[3],t[4],t[8])+')'}
function start(){var t=tasks[index];C={t:t,a:t[1],b:t[2],c:t[0]==='div'?t[4]:t[3],d:t[0]==='div'?t[3]:t[4],s:t[5]===t[6]?'+':'-'};rec={number:index+1,task:taskHTML(t),errors:[],skipped:false,remaining:[]};queue=[];[7,8].forEach(function(k){if(t[k])queue.push({kind:'convert',title:k===7?'Erste gemischte Zahl umwandeln':'Zweite gemischte Zahl umwandeln',k:k})});if(queue.length)queue.push({kind:'rewrite',title:'Unechte Brüche noch einmal anschreiben'});queue.push({kind:'long',title:t[0]==='div'?'Langer Bruchstrich (nach dem Kehrwert)':'Langer Bruchstrich'},{kind:'reduce',title:'Einmal kürzen – Kürzzahl notieren'},{kind:'multiply',title:'Faktoren multiplizieren'});pos=0;el('counter').textContent='Aufgabe '+(index+1)+' von 15';el('bar').style.width=(index/15*100)+'%';el('task').innerHTML=taskHTML(t);el('work').hidden=false;el('done').hidden=true;render()}
function render(){locked=false;if(pos>=queue.length){finishTask();return}var q=queue[pos],t=C.t,info='',entry='';if(q.kind==='convert'){var m=t[q.k],s=t[q.k===7?5:6];info='<div class="tip">Ganze Zahl · Nenner + Zähler. Der Nenner bleibt gleich.</div><p>'+num(s,0,0,m)+' = ?</p>';entry=sf(s,inp('n'),inp('d'))}if(q.kind==='rewrite'){info='<div class="tip">Die umgewandelten Brüche bleiben sichtbar:</div><p>'+sf(t[5],t[1],t[2])+' '+(t[0]==='mul'?'·':':')+' '+sf(t[6],t[3],t[4])+'</p>';entry='('+sf(t[5],inp('a'),inp('b'))+') '+(t[0]==='mul'?'·':':')+' ('+sf(t[6],inp('c'),inp('d'))+')'}if(q.kind==='long'){info='<p>'+sf(t[5],t[1],t[2])+' '+(t[0]==='mul'?'·':':')+' '+sf(t[6],t[3],t[4])+'</p>';if(t[0]==='div')info+='<div class="tip">Drehe den zweiten Bruch um: '+sf(t[6],t[4],t[3])+'. Dann multiplizieren.</div>';entry=sign()+f(inp('a')+' · '+inp('c'),inp('b')+' · '+inp('d'))}if(q.kind==='reduce'){info='<div class="tip">Kürze genau ein Zähler-Nenner-Paar durch dieselbe Zahl. Über Kreuz oder innerhalb eines Bruchs ist erlaubt. Wenn nichts kürzbar ist, trage 1 ein.</div><p>'+sf(C.s,C.a+' · '+C.c,C.b+' · '+C.d)+' = ?</p>';entry='<label>gekürzt durch '+inp('g')+'</label>'+sign()+f(inp('a')+' · '+inp('c'),inp('b')+' · '+inp('d'))}if(q.kind==='multiply'){var r=C.r;info='<div class="tip">Du hast durch '+C.g+' gekürzt. Deine gekürzten Faktoren:</div><p>'+sf(C.s,r.a+' · '+r.c,r.b+' · '+r.d)+' = ?</p>';entry=sf(C.s,inp('n'),inp('d'))}if(q.kind==='final'){info='<p>'+sf(C.s,C.rawN,C.rawD)+' = ?</p><div class="tip">Kürze den Ergebnisbruch vollständig.</div>';entry='<label>gekürzt durch '+inp('g')+'</label>'+sf(C.s,inp('n'),inp('d'))}if(q.kind==='mixed'){info='<p>'+sf(C.s,C.finN,C.finD)+' = ?</p>';entry=sg(C.s)+' '+inp('w')+' '+f(inp('n'),inp('d'))}el('title').textContent=q.title;el('info').innerHTML=info;el('entry').innerHTML=entry;el('msg').textContent=''}
function validReduction(v,g){var o=[C.a,C.b,C.c,C.d],pairs=[[0,1],[0,3],[2,1],[2,3]];if(!Number.isInteger(g)||g<1)return false;var possible=pairs.some(function(p){return gcd(o[p[0]],o[p[1]])>1});if(g===1)return !possible&&o.every(function(x,k){return x===v[k]});return pairs.some(function(p){if(o[p[0]]%g||o[p[1]]%g)return false;var x=o.slice();x[p[0]]/=g;x[p[1]]/=g;return x.every(function(z,k){return z===v[k]})})}
function check(){if(locked)return;var fields=Array.prototype.slice.call(el('entry').querySelectorAll('input,select'));if(fields.some(function(x){return x.value.trim()===''})){el('msg').textContent='Bitte fülle alle Felder aus.';return}var v={},invalid=false;fields.forEach(function(x){v[x.id]=x.tagName==='SELECT'?x.value:Number(x.value);if(x.tagName==='INPUT'&&(!Number.isInteger(v[x.id])||v[x.id]<0))invalid=true});if(invalid){el('msg').textContent='Bitte ganze, nicht negative Zahlen eintragen.';return}var q=queue[pos],t=C.t,ok=false;if(q.kind==='convert')ok=v.n===t[q.k===7?1:3]&&v.d===t[q.k===7?2:4];if(q.kind==='rewrite')ok=v.a===t[1]&&v.b===t[2]&&v.c===t[3]&&v.d===t[4];if(q.kind==='long')ok=v.s===C.s&&v.a===C.a&&v.b===C.b&&v.c===C.c&&v.d===C.d;if(q.kind==='reduce'){ok=v.s===C.s&&validReduction([v.a,v.b,v.c,v.d],v.g);if(ok){C.r={a:v.a,b:v.b,c:v.c,d:v.d};C.g=v.g;C.rawN=v.a*v.c;C.rawD=v.b*v.d;var g=gcd(C.rawN,C.rawD);C.finN=C.rawN/g;C.finD=C.rawD/g;if(g>1)queue.push({kind:'final',title:'Ergebnis vollständig kürzen'});if(C.finN>C.finD)queue.push({kind:'mixed',title:'Als gemischte Zahl schreiben'})}}if(q.kind==='multiply')ok=v.n===C.rawN&&v.d===C.rawD;if(q.kind==='final')ok=v.g===gcd(C.rawN,C.rawD)&&v.n===C.finN&&v.d===C.finD;if(q.kind==='mixed')ok=v.w===Math.floor(C.finN/C.finD)&&v.n===C.finN%C.finD&&v.d===C.finD;if(ok){el('msg').textContent='Richtig!';el('msg').className='ok';locked=true;pos++;setTimeout(render,300)}else{rec.errors.push({step:q.title,input:JSON.stringify(v)});el('msg').textContent='Noch nicht richtig. Prüfe deine Eingaben.';el('msg').className='bad'}}
function finishTask(){el('work').hidden=true;el('done').hidden=false;var r=C.r,text=sf(C.s,C.a+' · '+C.c,C.b+' · '+C.d)+' = '+sf(C.s,r.a+' · '+r.c,r.b+' · '+r.d)+' = '+sf(C.s,C.rawN,C.rawD);if(gcd(C.rawN,C.rawD)>1)text+=' = '+sf(C.s,C.finN,C.finD);if(C.finN>C.finD)text+=' = '+sg(C.s)+' '+Math.floor(C.finN/C.finD)+' '+f(C.finN%C.finD,C.finD);el('solution').innerHTML=text;el('next').textContent=index===14?'Zur Lehrerübersicht':'Nächste Aufgabe'}
function advance(){reports.push(rec);index++;if(index<15)start();else summary()}
function summary(){el('work').hidden=true;el('done').hidden=true;el('end').hidden=false;el('bar').style.width='100%';el('counter').textContent='Übung abgeschlossen';var skipped=reports.filter(function(r){return r.skipped}),total=reports.reduce(function(a,r){return a+r.errors.length},0),rows=reports.map(function(r){return '<tr><td>'+r.number+'</td><td>'+r.task+'</td><td>'+(r.skipped?'Übersprungen / nicht vollständig':'Vollständig bearbeitet')+'</td><td>'+r.errors.length+'<br>'+r.errors.map(function(e){return esc(e.step)}).join('<br>')+'</td><td>'+r.remaining.map(esc).join('<br>')+'</td></tr>'}).join(''),details=reports.filter(function(r){return r.errors.length}).map(function(r){return '<details><summary>Aufgabe '+r.number+': falsche Eingaben</summary>'+r.errors.map(function(e){return '<p>'+esc(e.step)+': '+esc(e.input)+'</p>'}).join('')+'</details>'}).join('');el('summary').innerHTML='<p>Name: <strong>'+esc(el('name').value.trim()||'ohne Namen')+'</strong><br>Vollständig bearbeitet: '+(15-skipped.length)+' von 15<br>Übersprungen: <strong>'+skipped.length+' von 15</strong><br>Übersprungene Aufgabennummern: '+(skipped.map(function(r){return r.number}).join(', ')||'Keine')+'<br>Fehlversuche: '+total+'</p>'+(skipped.length?'<div class="tip">Übersprungene Aufgaben gelten nicht als richtig gelöst. 0 Fehlversuche bedeutet bei übersprungenen Aufgaben nicht, dass sie richtig bearbeitet wurden.</div>':'')+'<table><tr><th>Nr.</th><th>Aufgabe</th><th>Status</th><th>Fehlversuche</th><th>Nicht bearbeitet</th></tr>'+rows+'</table>'+details+'<p>Die Übersicht wird nicht automatisch an die Lehrkraft gesendet. Bitte bei Bedarf drucken oder als PDF sichern.</p>'}
el('check').onclick=check;el('next').onclick=advance;el('skip').onclick=function(){if(locked)return;rec.skipped=true;rec.remaining=queue.slice(pos).map(function(q){return q.title});if(!C.r)rec.remaining.push('Gegebenenfalls Schlusskürzen und gemischte Zahl (noch nicht erreicht)');advance()};
window.addEventListener('error',function(e){el('error').hidden=false;el('error').textContent='Technischer Fehler: '+e.message});start();
})();</script></body></html>
