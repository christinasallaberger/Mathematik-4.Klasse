<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pythagoras üben – Hypotenuse und Kathete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fdfdf9; --grid:#d6e4f2; --ink:#1b2a4a; --pen:#1d4ed8; --muted:#5b6b85;
  --red:#c62828; --red-soft:#fdecea; --green:#2e7d32; --green-soft:#e6f4e7;
  --marker:#ffe36e; --tri:#eaf1fb; --card:#ffffff; --line:#c9d6e6; --btn:#1b2a4a; --btn-ink:#ffffff;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151b26; --grid:#222d3e; --ink:#e6ecf5; --pen:#8fb1ff; --muted:#9aa8bf;
    --red:#ff7a7a; --red-soft:#3a1e22; --green:#6fd17a; --green-soft:#17301c;
    --marker:#7a6516; --tri:#1e2a3e; --card:#1b2231; --line:#33415a; --btn:#e6ecf5; --btn-ink:#151b26;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#151b26; --grid:#222d3e; --ink:#e6ecf5; --pen:#8fb1ff; --muted:#9aa8bf;
  --red:#ff7a7a; --red-soft:#3a1e22; --green:#6fd17a; --green-soft:#17301c;
  --marker:#7a6516; --tri:#1e2a3e; --card:#1b2231; --line:#33415a; --btn:#e6ecf5; --btn-ink:#151b26;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:17px; line-height:1.5;
}
.wrap{max-width:1080px;margin:0 auto;padding:28px 18px 60px}
header h1{font-family:"Patrick Hand","Comic Sans MS",cursive;font-weight:400;font-size:clamp(34px,6vw,52px);line-height:1.05;margin:0 0 6px;color:var(--pen)}
header p{margin:0 0 20px;color:var(--muted);max-width:60ch}
.controls{display:flex;flex-wrap:wrap;gap:14px 22px;margin-bottom:22px}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{font:inherit;font-size:15px;border:0;background:transparent;color:var(--ink);padding:7px 14px;cursor:pointer}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.ctl-label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.namein{font:inherit;font-size:16px;padding:7px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);width:240px;max-width:100%}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.sheet{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px}
.task{font-size:20px;margin:0 0 8px}
.task b{font-family:"Patrick Hand",cursive;font-size:26px;color:var(--pen);font-weight:400}
svg{width:100%;height:auto;display:block}
.side{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.side.hyp{stroke:var(--red);stroke-width:4}
.side.unk{stroke-dasharray:8 6}
.tri{fill:var(--tri)}
.ra{fill:none;stroke:var(--ink);stroke-width:2}
.dot{fill:var(--ink)}
.lbl{font-family:"Patrick Hand",cursive;font-size:21px;fill:var(--ink)}
.lbl.unk{fill:var(--pen)}
.lbl.hypt{fill:var(--red)}
.merke{margin-top:10px;font-size:15px;color:var(--muted)}
.merke span{background:var(--marker);color:var(--ink);padding:1px 6px;border-radius:3px}
.way-title{margin:18px 0 4px;font-size:15px;color:var(--muted)}
.way{font-family:"Patrick Hand",cursive;font-size:25px;line-height:1.55;color:var(--pen);min-height:44px;border-left:3px solid var(--red);padding-left:14px}
.way:empty::before{content:"Hier entsteht dein Rechenweg.";color:var(--muted);font-size:19px}
.wline{animation:write .35s ease-out}
@keyframes write{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.wline.final{display:inline-block;border-bottom:3px double var(--pen);margin-top:2px}
.steps{display:flex;flex-direction:column;gap:12px}
.step{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.step.solved{border-color:var(--green)}
.step-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.num{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:15px}
.step.solved .num{background:var(--green);border-color:var(--green);color:var(--card)}
.step h3{margin:0;font-size:18px}
.step p{margin:0 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;font-family:"Patrick Hand",cursive;font-size:23px;min-width:56px;padding:4px 14px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){background:var(--tri)}
.opt.good{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.opt.wrongb{background:var(--red-soft);border-color:var(--red);color:var(--red);text-decoration:line-through}
.opt:disabled{cursor:default}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:"Patrick Hand",cursive;font-size:25px}
.eq sup{font-size:17px;margin-left:-4px;align-self:flex-start;margin-top:4px}
.n{font:inherit;font-family:"Patrick Hand",cursive;font-size:24px;width:84px;padding:2px 8px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);color:var(--pen);text-align:center}
.n.wide{width:110px}
.n.word{width:150px}
.n.opsel{width:64px;padding:2px 4px}
.opt.word{font-size:22px}
.n:disabled{border-color:var(--green);color:var(--green)}
.check,.next{font:inherit;font-size:16px;font-weight:700;padding:8px 16px;border-radius:10px;border:0;background:var(--btn);color:var(--btn-ink);cursor:pointer;margin-left:6px}
.check:disabled{opacity:.35;cursor:default}
.fb{font-size:15px;margin-top:8px}
.fb:empty{display:none}
.fb.bad{color:var(--red);background:var(--red-soft);padding:8px 10px;border-radius:8px}
.fb.ok{color:var(--green)}
.link{font:inherit;font-size:15px;background:none;border:0;padding:0;color:var(--pen);text-decoration:underline;cursor:pointer;margin-left:6px}
.done{background:var(--green-soft);border:2px solid var(--green);border-radius:14px;padding:16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.done[hidden]{display:none}
.done p{margin:0;font-size:18px}
.lbl .sub{font-size:16px;fill:var(--muted)}
.score{font-size:15px;color:var(--muted);margin:0 0 12px}
.namerow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.namerow .next{margin-left:0}
.namein.locked{border-color:var(--line);background:transparent;font-weight:700;cursor:default}
[hidden]{display:none!important}
.summary{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:20px}
.summary h2{font-family:"Patrick Hand",cursive;font-weight:400;font-size:32px;line-height:1.1;color:var(--pen);margin:0 0 14px}
.sumhead,.sumstats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-bottom:16px}
.sumhead span,.sumstats span{display:block;font-size:13px;color:var(--muted)}
.sumhead b{font-size:18px}
.sumstats{gap:10px}
.sumstats div{border:2px solid var(--line);border-radius:12px;padding:10px 14px;min-width:120px}
.sumstats b{font-size:26px}
.tablewrap{overflow-x:auto;margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:680px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:700}
tr.okrow td:first-child{box-shadow:inset 4px 0 var(--green)}
tr.errrow td:first-child{box-shadow:inset 4px 0 var(--red)}
.sumnote{color:var(--muted);font-size:15px}
.summary .next{margin-left:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.wline{animation:none}}
/* Bildschirm-Tastatur */
#kpad{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:3px solid var(--ink);padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(0,0,0,.18)}
#kpad[hidden],#kpadToggle[hidden]{display:none!important}
.kp-inner{max-width:420px;margin:0 auto}
.kp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:700;font-size:15px}
.kp-small{font:inherit;font-size:15px;padding:3px 12px;background:transparent;color:var(--ink);border:2px solid var(--ink);border-radius:8px;cursor:pointer}
.kp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kp-grid button{font:inherit;font-family:"Patrick Hand",cursive;font-size:26px;padding:6px 0;background:var(--paper);color:var(--ink);border:2px solid var(--line);border-radius:10px;cursor:pointer;touch-action:manipulation}
.kp-grid button.op{border-color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:20px;font-weight:700}
.kp-grid button.act{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.kp-grid button.wordk{grid-column:span 2;font-size:24px;color:var(--pen);border-color:var(--pen)}
.kp-grid button:active{transform:translateY(1px)}
#kpadToggle{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:49;font:inherit;font-size:16px;font-weight:700;padding:9px 16px;border-radius:999px;border:0;background:var(--btn);color:var(--btn-ink);cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2)}
body.kpad-on{padding-bottom:300px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Pythagoras üben</h1>
    <p>Hypotenuse und Katheten im rechtwinkligen Dreieck berechnen – Schritt für Schritt, wie im Heft.</p>
  </header>

  <div class="controls">
    <div>
      <span class="ctl-label">Niveau</span>
      <div class="seg" id="level">
        <button data-v="standard" aria-pressed="true">Standard</button>
        <button data-v="ahs" aria-pressed="false">Standard AHS</button>
      </div>
    </div>
    <div>
      <label class="ctl-label" for="name">Dein Name</label>
      <div class="namerow"><input id="name" class="namein" autocomplete="off" placeholder="Vor- und Nachname"><button class="next" id="nameOk">Los geht's</button></div>
    </div>
  </div>

  <p class="score" id="score">Gelöste Aufgaben: 0 – davon ohne Fehler: 0</p>

  <div class="grid">
    <div class="sheet">
      <p class="task" id="taskText"></p>
      <div id="fig"></div>
      <p class="way-title">Rechenweg</p>
      <div class="way" id="way"></div>
    </div>
    <div>
      <div class="steps" id="steps"></div>
      <div class="done" id="done" hidden>
        <p id="doneText"></p>
        <button class="next" id="nextBtn">Nächste Aufgabe</button>
      </div>
    </div>
  </div>
<section class="summary" id="summary" hidden></section>
</div>

<script>
const TRIPLES=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[12,16,20],[15,20,25],[10,24,26],[20,21,29],[7,24,25],[18,24,30],[16,30,34],[21,28,35],[12,35,37],[24,32,40],[9,40,41],[27,36,45],[14,48,50],[30,40,50],[11,60,61]];
let bag=[],lastT=null;const usedAhs=new Set();
function nextTriple(){if(!bag.length){bag=shuffle(TRIPLES);if(bag[bag.length-1]===lastT)bag.reverse();}lastT=bag.pop();return lastT;}
const NAMES=[['a','b','c'],['x','y','z'],['p','q','r'],['e','f','g'],['u','v','w'],['k','m','n']];
const state={level:'standard',solved:0,perfect:0,taskNo:Math.random()<.5?0:1};
const LETTERS='abcdefghkmnpqrstuvwxyz'.split('');
let lastLetters='';
function pickLetters(){let nm;do{nm=shuffle(LETTERS).slice(0,3).sort();}while(nm.join('')===lastLetters);lastLetters=nm.join('');return nm;}
function updateScore(){const n=$('#name').value.trim();$('#score').textContent=(n?n+': ':'')+`Gelöst: ${state.solved} von 8, davon ohne Fehler: ${state.perfect}`;}
let task=null;
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function fmt(x){return String(Math.round(x*100)/100).replace('.',',')}
function parseNum(s){s=String(s).trim().replace(',','.');if(s==='')return NaN;return Number(s)}

function newTask(){
  const std=state.level==='standard';
  const find=(state.taskNo++%2===0)?'hyp':'leg';
  let hypName,legNames;
  {const nm=pickLetters();hypName=nm[2];legNames=Math.random()<.5?[nm[0],nm[1]]:[nm[1],nm[0]];}
  let l1,l2,h,tries=0;
  if(std){const t=nextTriple();[l1,l2,h]=Math.random()<.5?[t[0],t[1],t[2]]:[t[1],t[0],t[2]];}
  else{let key;do{
    if(find==='hyp'){l1=3+rnd(13);l2=3+rnd(13);h=Math.hypot(l1,l2);key='h'+Math.min(l1,l2)+','+Math.max(l1,l2);}
    else{l1=3+rnd(12);h=l1+2+rnd(10);l2=Math.sqrt(h*h-l1*l1);key='k'+h+','+l1;}
  }while(usedAhs.has(key)&&++tries<300);usedAhs.add(key);}
  const unknown=find==='hyp'?hypName:legNames[1];
  const sq=find==='hyp'?l1*l1+l2*l2:h*h-l1*l1;
  task={find,hypName,legNames,l1,l2,h,unknown,sq,ans:Math.sqrt(sq),std,
    rot:std?0:pick([0,Math.PI/2,Math.PI,3*Math.PI/2])+(Math.random()-.5)*0.6,
    flip:!std&&Math.random()<.5,hypShown:false,errors:0};
  $('#steps').innerHTML='';$('#way').innerHTML='';$('#done').hidden=true;
  $('#taskText').innerHTML=`Zwei Seiten sind gegeben. Berechne die fehlende Seite <b>${unknown}</b>.`;
  draw();
  if(!state.nameLocked){task.waiting=true;$('#steps').innerHTML='<div class="step"><p>Gib oben zuerst deinen Namen ein und tippe auf „Los geht\'s“. Der Name kann danach nicht mehr geändert werden.</p></div>';return;}
  stepFind();
}

function draw(){
  const t=task,W=380,H=270,PX=92,PY=42;
  let pts=[[0,0],[t.l1,0],[0,t.l2]].map(([x,y])=>[t.flip?-x:x,-y]);
  const c=Math.cos(t.rot),s=Math.sin(t.rot);
  pts=pts.map(([x,y])=>[x*c-y*s,x*s+y*c]);
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys);
  const sc=Math.min((W-2*PX)/(mxx-mnx||1),(H-2*PY)/(mxy-mny||1));
  const ox=(W-(mxx-mnx)*sc)/2,oy=(H-(mxy-mny)*sc)/2;
  const S=pts.map(([x,y])=>[ox+(x-mnx)*sc,oy+(y-mny)*sc]);
  const [A,B,C]=S;const cen=[(A[0]+B[0]+C[0])/3,(A[1]+B[1]+C[1])/3];
  const unit=(p,q)=>{const dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy);return[dx/l,dy/l]};
  const u=unit(A,B),v=unit(A,C),m=16;
  const ra=`M${A[0]+u[0]*m},${A[1]+u[1]*m} L${A[0]+u[0]*m+v[0]*m},${A[1]+u[1]*m+v[1]*m} L${A[0]+v[0]*m},${A[1]+v[1]*m}`;
  const dotX=A[0]+(u[0]+v[0])*m*0.5,dotY=A[1]+(u[1]+v[1])*m*0.5;
  const sides=[[A,B,t.legNames[0],t.l1,false],[A,C,t.legNames[1],t.l2,false],[B,C,t.hypName,t.h,true]];
  let lines='',labels='';
  sides.forEach(([p,q,name,val,isH])=>{
    const mid=[(p[0]+q[0])/2,(p[1]+q[1])/2];
    let dx=mid[0]-cen[0],dy=mid[1]-cen[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
    const lx=mid[0]+dx*16,ly=mid[1]+dy*18;
    const anchor=dx>0.35?'start':dx<-0.35?'end':'middle';
    const unk=name===t.unknown,hl=isH&&t.hypShown;
    const txt=unk?`${name} = ?<tspan class="sub" x="${lx}" dy="1.15em">gesucht</tspan>`:`${name} = ${fmt(val)} cm`;
    lines+=`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" class="side${hl?' hyp':''}${unk?' unk':''}"/>`;
    labels+=`<text x="${lx}" y="${ly}" text-anchor="${anchor}" dominant-baseline="middle" class="lbl${unk?' unk':''}${hl?' hypt':''}">${txt}</text>`;
  });
  $('#fig').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Rechtwinkliges Dreieck">
    <polygon class="tri" points="${S.map(p=>p.join(',')).join(' ')}"/>${lines}
    <path class="ra" d="${ra}"/><circle class="dot" cx="${dotX}" cy="${dotY}" r="2.2"/>${labels}</svg>`;
}

function addStep(num,title,body){
  const d=document.createElement('section');d.className='step';
  d.innerHTML=`<div class="step-head"><span class="num">${num}</span><h3>${title}</h3></div><div class="body">${body}</div><div class="fb" aria-live="polite"></div>`;
  $('#steps').appendChild(d);
  const first=d.querySelector('input');if(first&&num>1)first.focus({preventScroll:true});
  if(num>1)d.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});
  return d;
}
function wrong(d,msg,solve){
  task.errors++;d.tries=(d.tries||0)+1;(task.errSteps=task.errSteps||new Set()).add(d.querySelector('h3').textContent);
  const fb=d.querySelector('.fb');fb.className='fb bad';fb.innerHTML=msg;
  if(d.tries>=2){const b=document.createElement('button');b.className='link';b.textContent='Lösung zeigen';b.onclick=()=>{task.shown=(task.shown||0)+1;solve();};fb.appendChild(b);}
}
function right(d,msg){
  d.classList.add('solved');const fb=d.querySelector('.fb');fb.className='fb ok';fb.textContent='✓ '+msg;
  d.querySelectorAll('input,button,select').forEach(e=>e.disabled=true);
}
function addWay(html,cls){const el=document.createElement('div');el.className='wline'+(cls?' '+cls:'');el.innerHTML=html;$('#way').appendChild(el);}
function bindCheck(d,fn){d.querySelector('.check').onclick=fn;d.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')fn()}));}

// Schritt 1: Hypotenuse erkennen
function step1(){
  const names=[...task.legNames,task.hypName].sort();
  const d=addStep(1,'Welche Seite ist die Hypotenuse?',`<div class="opts">${names.map(n=>`<button class="opt" data-v="${n}">${n}</button>`).join('')}</div>`);
  const solve=()=>{d.querySelector(`[data-v="${task.hypName}"]`).classList.add('good');
    right(d,`Richtig: ${task.hypName} liegt gegenüber vom rechten Winkel.`);task.hypShown=true;draw();stepFind();};
  d.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(b.dataset.v===task.hypName)solve();
    else{b.classList.add('wrongb');b.disabled=true;wrong(d,'Nicht ganz. Die Hypotenuse liegt dem rechten Winkel gegenüber – sie ist die längste Seite.',solve);}
  });
}

// Schritt 2: Was ist gesucht?
function stepFind(){
  const U=task.unknown;
  const d=addStep(1,'Was ist gesucht?',`<p>Ist die gesuchte Seite ${U} eine Hypotenuse oder eine Kathete?</p><div class="opts"><button class="opt word" data-v="hyp">Hypotenuse</button><button class="opt word" data-v="leg">Kathete</button></div>`);
  const solve=()=>{d.querySelector(`[data-v="${task.find}"]`).classList.add('good');
    right(d,task.find==='hyp'?`Richtig: ${U} ist die Hypotenuse.`:`Richtig: ${U} ist eine Kathete.`);task.hypShown=true;draw();stepWords();};
  d.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(b.dataset.v===task.find)solve();
    else{b.classList.add('wrongb');b.disabled=true;
      wrong(d,task.find==='hyp'?`${U} liegt gegenüber vom rechten Winkel – also ist ${U} die Hypotenuse.`:`${U} liegt direkt am rechten Winkel – die Hypotenuse ist ${task.hypName}.`,solve);}
  });
}

// Schritt 3: Erste Zeile in Worten
function stepWords(){
  const inp=n=>`<input class="n word" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Wort ${n}">`;
  const d=addStep(2,'Erste Zeile: Formel in Worten',`<p>Schreibe die Formel mit den Wörtern Hypotenuse und Kathete – passend dazu, was gesucht ist – und wähle das Rechenzeichen.</p><div class="eq">${inp(1)}<sup>2</sup><span>=</span>${inp(2)}<sup>2</sup><select class="n opsel" aria-label="Rechenzeichen"><option value="">?</option><option value="+">+</option><option value="−">−</option></select>${inp(3)}<sup>2</sup><button class="check">Prüfen</button></div>`);
  const ins=[...d.querySelectorAll('input')];
  const isH=s=>/^hypo?th?enuse$/i.test(s.trim()),isK=s=>/^kath?ete$/i.test(s.trim());
  const leg=task.find==='leg',sel=d.querySelector('select');
  const W=leg?['Kathete','Hypotenuse','Kathete']:['Hypotenuse','Kathete','Kathete'],OP=leg?'−':'+';
  const solve=()=>{W.forEach((w,i)=>ins[i].value=w);sel.value=OP;
    right(d,'Richtig – das ist die erste Zeile!');addWay(`${W[0]}² = ${W[1]}² ${OP} ${W[2]}²`);step2();};
  bindCheck(d,()=>{
    const v=ins.map(i=>i.value);
    if(v.some(x=>!x.trim())){const fb=d.querySelector('.fb');fb.className='fb bad';fb.textContent='Bitte alle drei Felder ausfüllen.';return;}
    if(!sel.value){const fb=d.querySelector('.fb');fb.className='fb bad';fb.textContent='Wähle noch das Rechenzeichen (+ oder −).';return;}
    const wordsOk=leg?(isK(v[0])&&isH(v[1])&&isK(v[2])):(isH(v[0])&&isK(v[1])&&isK(v[2]));
    if(wordsOk&&sel.value===OP)solve();
    else if(wordsOk)wrong(d,leg?'Die Wörter stimmen. Überlege noch einmal: Wird für eine Kathete addiert oder subtrahiert?':'Die Wörter stimmen. Überlege noch einmal: Wird für die Hypotenuse addiert oder subtrahiert?',solve);
    else if(leg&&isH(v[0]))wrong(d,'Gesucht ist eine Kathete – also steht die Kathete allein links vom Ist-gleich.',solve);
    else if(!leg&&isK(v[0]))wrong(d,'Gesucht ist die Hypotenuse – also steht sie allein links vom Ist-gleich.',solve);
    else wrong(d,'Verwende die Wörter Hypotenuse und Kathete. Links vom Ist-gleich steht die gesuchte Seite.',solve);
  });
}

// Schritt 4: Formel aufstellen
function step2(){
  const H=task.hypName,[A,B]=[...task.legNames].sort(),U=task.unknown,K=task.legNames[0];
  let correct,opts;
  if(task.find==='hyp'){correct=`${H}² = ${A}² + ${B}²`;opts=[correct,`${A}² = ${H}² + ${B}²`,`${H}² = ${A}² − ${B}²`];}
  else{correct=`${U}² = ${H}² − ${K}²`;opts=[correct,`${U}² = ${H}² + ${K}²`,`${U}² = ${K}² − ${H}²`];}
  opts=shuffle(opts);
  const intro=task.find==='hyp'?'Gesucht ist die Hypotenuse. Welche Formel passt?':'Gesucht ist eine Kathete. Welche Formel passt?';
  const d=addStep(3,'Variablen aus der Skizze einsetzen',`<p>${intro}</p><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>`);
  const solve=()=>{d.querySelectorAll('.opt').forEach(b=>{if(b.textContent===correct)b.classList.add('good')});
    right(d,'Richtige Formel!');
    addWay(correct);step3();};
  d.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(b.textContent===correct)solve();
    else{b.classList.add('wrongb');b.disabled=true;
      wrong(d,task.find==='hyp'
        ?'Die Hypotenuse steht allein auf einer Seite: Hypotenuse² = Kathete² + Kathete².'
        :`Für eine Kathete wird umgeformt: aus ${H}² = ${A}² + ${B}² wird Kathete² = Hypotenuse² − andere Kathete².`,solve);}
  });
}

// Schritt 3: Zahlen einsetzen
function step3(){
  const U=task.unknown,op=task.find==='hyp'?'+':'−';
  const d=addStep(4,'Zahlen einsetzen',`<p>Setze die Längen aus der Skizze ein (ohne cm).</p><div class="eq"><span>${U}² =</span><input class="n" inputmode="decimal" aria-label="erste Zahl"><sup>2</sup><span>${op}</span><input class="n" inputmode="decimal" aria-label="zweite Zahl"><sup>2</sup><button class="check">Prüfen</button></div>`);
  const [i1,i2]=d.querySelectorAll('input');
  const exp=task.find==='hyp'?[task.l1,task.l2]:[task.h,task.l1];
  const solve=()=>{if(isNaN(parseNum(i1.value))||isNaN(parseNum(i2.value))||!ok()){i1.value=fmt(exp[0]);i2.value=fmt(exp[1]);}
    right(d,'Richtig eingesetzt!');addWay(`${U}² = ${i1.value}² ${op} ${i2.value}²`);step4(parseNum(i1.value),parseNum(i2.value));};
  const ok=()=>{const a=parseNum(i1.value),b=parseNum(i2.value);
    return task.find==='hyp'?((a===exp[0]&&b===exp[1])||(a===exp[1]&&b===exp[0])):(a===exp[0]&&b===exp[1]);};
  bindCheck(d,()=>{
    const a=parseNum(i1.value),b=parseNum(i2.value);
    if(isNaN(a)||isNaN(b)){const fb=d.querySelector('.fb');fb.className='fb bad';fb.textContent='Bitte beide Felder ausfüllen.';return;}
    if(ok())solve();
    else if(task.find==='leg'&&a===exp[1]&&b===exp[0])wrong(d,'Vorsicht, Reihenfolge! Bei der Kathete kommt zuerst die Hypotenuse, dann wird die andere Kathete abgezogen.',solve);
    else wrong(d,task.find==='hyp'?'Setze die Längen der beiden Katheten aus der Skizze ein.':`Setze zuerst die Hypotenuse ${task.hypName}, dann die bekannte Kathete ${task.legNames[0]} ein.`,solve);
  });
}

// Schritt 4: Berechnen
function step4(x,y){
  const U=task.unknown,op=task.find==='hyp'?'+':'−';
  const d=addStep(5,'Berechnen',`<p>Rechne die Quadrate aus und dann ${task.find==='hyp'?'addiere':'subtrahiere'} sie.</p><div class="eq"><span>${U}² =</span><input class="n wide" inputmode="decimal" aria-label="Ergebnis"><button class="check">Prüfen</button></div>`);
  const [i1]=d.querySelectorAll('input');
  const solve=()=>{i1.value=fmt(task.sq);right(d,'Richtig gerechnet!');
    addWay(`${U}² = ${fmt(task.sq)}`);step5();};
  bindCheck(d,()=>{
    const a=parseNum(i1.value);if(isNaN(a))return;
    if(Math.abs(a-task.sq)<1e-9)solve();
    else if(Math.abs(a-(task.find==='hyp'?x+y:x-y))<1e-9)wrong(d,`Du hast die Zahlen noch nicht quadriert. Zum Beispiel: ${fmt(x)}² = ${fmt(x)} · ${fmt(x)}.`,solve);
    else if(Math.abs(a-(task.find==='hyp'?x*x-y*y:x*x+y*y))<1e-9)wrong(d,`Achte auf das Rechenzeichen: hier wird ${task.find==='hyp'?'addiert':'subtrahiert'}.`,solve);
    else wrong(d,`Rechne zuerst ${fmt(x)}² = ${fmt(x)} · ${fmt(x)} und ${fmt(y)}² = ${fmt(y)} · ${fmt(y)}.`,solve);
  });
}

// Schritt 5: Wurzel ziehen
function step5(){
  const U=task.unknown,std=task.std;
  const d=addStep(6,'Wurzel ziehen',`<p>${std?`Ziehe die Wurzel aus ${U}² = ${fmt(task.sq)}.`:`Ziehe die Wurzel aus ${U}² = ${fmt(task.sq)} und runde auf 2 Dezimalstellen.`}</p><div class="eq"><span>${U} =</span><input class="n wide" inputmode="decimal" aria-label="Ergebnis"><span>cm</span><button class="check">Prüfen</button></div>`);
  const [i1]=d.querySelectorAll('input');
  const exact=Number.isInteger(task.ans);
  const solve=()=>{i1.value=fmt(task.ans);right(d,'Super, Aufgabe gelöst!');
    addWay(`√${U}² = √${fmt(task.sq)}`);
    addWay(`${U} ${exact?'=':'≈'} ${fmt(task.ans)} cm`,'final');finish();};
  bindCheck(d,()=>{
    const a=parseNum(i1.value);if(isNaN(a))return;
    const tol=std?1e-9:0.011;
    if(Math.abs(a-task.ans)<=tol)solve();
    else if(Math.abs(a-task.sq)<1e-9)wrong(d,`Das ist noch ${U}². Du musst noch die Wurzel ziehen.`,solve);
    else if(Math.abs(a-task.sq/2)<1e-9)wrong(d,'Wurzel ziehen heißt nicht durch 2 teilen! Gesucht ist die Zahl, die mit sich selbst multipliziert das Ergebnis ergibt.',solve);
    else wrong(d,std?`Welche Zahl ergibt mal sich selbst ${fmt(task.sq)}?`:`Tippe √${fmt(task.sq)} in den Taschenrechner und runde auf 2 Dezimalstellen.`,solve);
  });
}

function finish(){
  state.solved++;if(task.errors===0)state.perfect++;
  logTask();
  updateScore();
  $('#doneText').innerHTML=(task.errors===0?'Fehlerfrei gelöst – stark!':`Geschafft! (${task.errors} ${task.errors===1?'Fehlversuch':'Fehlversuche'})`)+'<br><strong>✏️ Übertrage jetzt den ganzen Rechenweg in dein Hausübungsheft.</strong><br><span style="font-size:15px">Du findest ihn oben unter „Rechenweg“.</span>';
  $('#nextBtn').textContent=state.log.length>=ROUND?'Zur Zusammenfassung':'Nächste Aufgabe';
  $('#done').hidden=false;$('#nextBtn').focus({preventScroll:true});
  $('#done').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function setupSeg(id,key){
  document.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=()=>{
    document.querySelectorAll(`#${id} button`).forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));
    state[key]=b.dataset.v;newTask();
  });
}
const ROUND=8;state.log=[];
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function logTask(){
  const t=task;
  const given=(t.find==='hyp'?[[t.legNames[0],t.l1],[t.legNames[1],t.l2]]:[[t.hypName,t.h],[t.legNames[0],t.l1]]).sort((a,b)=>a[0]<b[0]?-1:1);
  state.log.push({find:t.find,given:given.map(([n,v])=>`${n} = ${fmt(v)} cm`).join(', '),
    result:`${t.unknown} ${Number.isInteger(t.ans)?'=':'≈'} ${fmt(t.ans)} cm`,errors:t.errors,shown:t.shown||0,
    errSteps:t.errSteps?[...t.errSteps].join(', '):'–',level:t.std?'Standard':'Standard AHS'});
}
function showSummary(){
  const L=state.log,name=$('#name').value.trim()||'–';
  const perfect=L.filter(r=>r.errors===0).length,errs=L.reduce((s,r)=>s+r.errors,0),shown=L.reduce((s,r)=>s+r.shown,0);
  const levels=[...new Set(L.map(r=>r.level))].join(' / ');
  const now=new Date();
  const dt=now.toLocaleDateString('de-AT')+', '+now.toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'});
  const rows=L.map((r,i)=>`<tr class="${r.errors===0?'okrow':r.shown?'errrow':''}"><td>${i+1}</td><td>${r.find==='hyp'?'Hypotenuse':'Kathete'}</td><td>${r.given}</td><td>${r.result}</td><td>${r.errors}</td><td>${r.shown?'ja ('+r.shown+'×)':'nein'}</td><td>${esc(r.errSteps)}</td></tr>`).join('');
  const s=$('#summary');
  s.innerHTML=`<h2>Zusammenfassung für die Lehrkraft</h2>
    <div class="sumhead"><div><span>Name</span><b>${esc(name)}</b></div><div><span>Datum</span><b>${dt}</b></div><div><span>Niveau</span><b>${levels}</b></div></div>
    <div class="sumstats"><div><b>${perfect} / ${L.length}</b><span>ohne Fehler</span></div><div><b>${errs}</b><span>Fehlversuche gesamt</span></div><div><b>${shown}</b><span>Lösungen angezeigt</span></div></div>
    <div class="tablewrap"><table><thead><tr><th>Nr.</th><th>Gesucht</th><th>Gegeben</th><th>Ergebnis</th><th>Fehlversuche</th><th>Lösung gezeigt</th><th>Fehler bei Schritt</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="sumnote">Zeige diese Seite deiner Lehrkraft. Die Rechenwege stehen in deinem Hausübungsheft.</p>
    <button class="next" id="newRound">Neue Runde starten</button>`;
  document.querySelector('.grid').hidden=true;document.querySelector('.controls').hidden=true;$('#score').hidden=true;s.hidden=false;
  window.scrollTo({top:0});
  $('#newRound').onclick=()=>{if(!confirm('Neue Runde starten? Die Zusammenfassung wird dabei gelöscht.'))return;
    state.log=[];state.solved=0;state.perfect=0;s.hidden=true;
    document.querySelector('.grid').hidden=false;document.querySelector('.controls').hidden=false;$('#score').hidden=false;
    updateScore();newTask();};
}
setupSeg('level','level');
function lockName(){const n=$('#name');if(state.nameLocked)return;if(!n.value.trim()){n.focus();return;}
  n.value=n.value.trim();n.readOnly=true;n.classList.add('locked');n.setAttribute('aria-readonly','true');$('#nameOk').hidden=true;state.nameLocked=true;updateScore();
  if(task&&task.waiting){task.waiting=false;$('#steps').innerHTML='';stepFind();}}
$('#nameOk').onclick=lockName;
$('#name').addEventListener('keydown',e=>{if(e.key==='Enter')lockName();});
$('#nextBtn').onclick=()=>state.log.length>=ROUND?showSummary():newTask();
newTask();

/* ---------- Bildschirm-Tastatur ---------- */
(function(){
  /* Zahlenfelder: Ziffern, Komma, Löschen, Cursor, nächstes Feld, Prüfen */
  const NUM=['7','8','9','⌫','4','5','6',',','1','2','3','←','0','→','⇥','↵'];
  /* Wortfelder (erste Zeile in Worten): ganze Wörter und Rechenzeichen */
  const WORD=['Hypotenuse','Kathete','+','−','⌫','⇥','↵'];
  const TITLE={'⌫':'Löschen','←':'Cursor nach links','→':'Cursor nach rechts','⇥':'Nächstes Feld','↵':'Prüfen',',':'Komma','+':'Rechenzeichen plus','−':'Rechenzeichen minus'};
  const coarse=window.matchMedia&&matchMedia('(pointer: coarse)').matches;
  let enabled=true,target=null,mode='';

  const pad=document.createElement('div');pad.id='kpad';pad.hidden=true;pad.setAttribute('role','group');pad.setAttribute('aria-label','Bildschirm-Tastatur');
  pad.innerHTML='<div class="kp-inner"><div class="kp-head"><span id="kpTitle">Tastatur</span><button type="button" class="kp-small" id="kpClose" title="Tastatur ausblenden">✕</button></div><div class="kp-grid"></div></div>';
  const tog=document.createElement('button');tog.id='kpadToggle';tog.type='button';tog.textContent='⌨ Tastatur';tog.hidden=true;
  document.body.append(pad,tog);
  const grid=pad.querySelector('.kp-grid');

  const isWord=el=>el.classList.contains('word');
  const eligible=el=>el&&el.tagName==='INPUT'&&el.id!=='name'&&!el.disabled&&!el.readOnly;
  function draw(m){
    if(m===mode)return;mode=m;
    const keys=m==='word'?WORD:NUM;
    grid.innerHTML=keys.map(k=>{
      const cls=k==='↵'?'act':(k==='Hypotenuse'||k==='Kathete')?'wordk':/^[0-9,]$/.test(k)?'':'op';
      return '<button type="button" class="'+cls+'" data-key="'+k+'"'+(TITLE[k]?' title="'+TITLE[k]+'" aria-label="'+TITLE[k]+'"':'')+'>'+k+'</button>';}).join('');
    document.getElementById('kpTitle').textContent=m==='word'?'Wörter und Rechenzeichen':'Zahlen';
  }
  function applyMode(el){
    if(!('im' in el.dataset))el.dataset.im=el.getAttribute('inputmode')||'';
    if(enabled&&coarse)el.setAttribute('inputmode','none');
    else if(el.dataset.im)el.setAttribute('inputmode',el.dataset.im);else el.removeAttribute('inputmode');
  }
  const applyAll=()=>document.querySelectorAll('input').forEach(i=>{if(i.id!=='name')applyMode(i);});
  let t0=null;new MutationObserver(()=>{clearTimeout(t0);t0=setTimeout(applyAll,30);}).observe(document.body,{childList:true,subtree:true});
  function showPad(){pad.hidden=false;tog.hidden=true;document.body.classList.add('kpad-on');}
  function hidePad(){pad.hidden=true;document.body.classList.remove('kpad-on');tog.hidden=false;}

  document.addEventListener('focusin',e=>{
    if(!eligible(e.target))return;
    target=e.target;applyMode(target);draw(isWord(target)?'word':'num');
    if(enabled)showPad();else tog.hidden=false;
  });
  ['pointerdown','mousedown'].forEach(ev=>pad.addEventListener(ev,e=>e.preventDefault()));

  const visibleInputs=()=>[...document.querySelectorAll('input')].filter(i=>eligible(i)&&i.offsetParent!==null);
  function press(k){
    if(!target||!document.body.contains(target)||target.disabled){const f=visibleInputs()[0];if(!f)return;target=f;draw(isWord(f)?'word':'num');}
    target.focus({preventScroll:true});
    const v=target.value;let s=target.selectionStart,e=target.selectionEnd;if(s==null){s=e=v.length;}
    const step=target.closest('.step');
    if(k==='↵'){target.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));return;}
    if(k==='⇥'){const all=visibleInputs(),i=all.indexOf(target);const n=all[i+1]||all[0];if(n){n.focus();}return;}
    if(k==='+'||k==='−'){const sel=step&&step.querySelector('select');if(sel&&!sel.disabled){sel.value=k;sel.dispatchEvent(new Event('change',{bubbles:true}));}return;}
    if(k==='Hypotenuse'||k==='Kathete'){target.value=k;target.dispatchEvent(new Event('input',{bubbles:true}));
      const all=visibleInputs(),i=all.indexOf(target),n=all[i+1];if(n&&step&&step.contains(n)&&!n.value)n.focus();return;}
    if(k==='←'){const p=Math.max(0,s-1);target.setSelectionRange(p,p);return;}
    if(k==='→'){const p=Math.min(v.length,e+1);target.setSelectionRange(p,p);return;}
    let nv,pos;
    if(k==='⌫'){
      if(isWord(target)){nv='';pos=0;}
      else if(s!==e){nv=v.slice(0,s)+v.slice(e);pos=s;}
      else if(s>0){nv=v.slice(0,s-1)+v.slice(s);pos=s-1;}else return;}
    else{nv=v.slice(0,s)+k+v.slice(e);pos=s+k.length;}
    target.value=nv;try{target.setSelectionRange(pos,pos);}catch(_){}
    target.dispatchEvent(new Event('input',{bubbles:true}));
  }
  grid.addEventListener('click',e=>{const b=e.target.closest('[data-key]');if(b)press(b.dataset.key);});
  document.getElementById('kpClose').addEventListener('click',()=>{enabled=false;applyAll();hidePad();});
  tog.addEventListener('click',()=>{enabled=true;applyAll();showPad();
    const f=(target&&document.body.contains(target)&&!target.disabled)?target:visibleInputs()[0];if(f)f.focus();});
  draw('num');applyAll();
})();
</script>
